openapi: 3.0.3
info:
  title: Dinas WMS — API
  version: 0.16.0
  description: >
    Contrato de la API del middleware Dinas WMS.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.16.0 — RECOGER PAGO (Bloque 4C) · cierra la app de driver
    ══════════════════════════════════════════════════════════════════════════

    ★ ESTE BLOQUE TOCA DINERO — merece más cuidado que los demás
      Los otros bloques registran INFORMACIÓN; este registra DINERO RECIBIDO.
      Un retorno perdido se reconstruye preguntándole al cliente; un pago
      perdido significa que alguien entregó efectivo sin constancia, y eso puede
      terminar en una acusación a un driver honesto.
      De ahí las dos reglas duras:
        · IDEMPOTENCIA obligatoria (payment_uuid generado por la app). Un pago
          duplicado es tan malo como uno perdido.
        · REGISTRO INMUTABLE: un pago NO se edita ni se borra. Si hubo error se
          ANULA, dejando el rastro.

    ★ QUÉ REGISTRA
      Cliente (de SU ruta), monto, tipo (CASH o CHEQUE) y la hora real.
      · CHEQUE: número de cheque + FOTO OBLIGATORIA (es un documento físico;
        fotografiarlo protege al driver y a la empresa).
      · CASH: sin foto (no hay documento que fotografiar).

    ★ NO SE APLICA A FACTURAS
      Es un monto suelto. El admin lo aplica después en SAP. Nada se escribe a
      SAP desde aquí.

    ★ ANULACIÓN CON RASTRO
      El driver puede anular un pago mal registrado, con MOTIVO OBLIGATORIO.
      El registro NO desaparece: queda como anulado, con quién, cuándo y por qué.
      Se puede anular EN CUALQUIER MOMENTO, incluso con la ruta ya cerrada —
      el error suele notarse al cuadrar la caja en la bodega.

    ★ EL DRIVER VE SU CAJA
      Total recogido en la ruta, separado por CASH y CHEQUE. Al terminar trae
      ese dinero encima y necesita saber cuánto es.
      Los anulados NO suman.

    ★ OFFLINE igual que todo: se encola, `occurred_at` lleva la hora real.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.15.0 — RETORNO DE PRODUCTO (Bloque 4B)
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ ES
      El cliente devuelve mercancía de FACTURAS ANTERIORES (no de la entrega de
      hoy — eso son los rejected_items del 4A). El driver la recibe durante su
      visita, la documenta con una FOTO, y queda registrada para el admin.

    ★ ES UN REGISTRO, NO UN MOVIMIENTO DE INVENTARIO
      Nada se escribe a SAP. El admin lo procesa manualmente. Cuando exista
      BIN LOAD, ahí se decidirá el reingreso al stock.

    ★ EL CLIENTE ES DE SU RUTA
      No se busca entre todos los clientes: el retorno es de una de las paradas
      que el driver ya tiene descargadas. Si no va a pasar por ese cliente, no
      hay quien le entregue la mercancía.
      Puede registrarlo en CUALQUIER MOMENTO de la ruta, no solo estando en esa
      parada.

    ★ EL ÍTEM SE BUSCA EN EL CATÁLOGO COMPLETO
      Un retorno es de compras anteriores, así que el ítem puede NO estar en el
      camión de hoy. La app descarga el catálogo de ítems vendibles junto con la
      ruta (~540 ítems) para poder buscar sin conexión, por código o nombre.

    ★ VARIOS ÍTEMS POR RETORNO, UNA FOTO
      Cada ítem con su cantidad y su motivo: DANADO · EXPIRADO · NO_LO_QUIERE.
      La FOTO es OBLIGATORIA — es la evidencia de lo que se recibió.

    ★ LA FOTO VIAJA EN EL MISMO POST (base64)
      La app la REDIMENSIONA antes de enviar (~1024px, calidad ~70% → 150-300KB).
      Una sola petición: o entra el retorno completo con su foto, o no entra.
      Eso es lo que exige que la foto sea obligatoria — un segundo paso podría
      fallar y dejar retornos sin evidencia.
      El middleware la guarda EN DISCO y conserva la ruta en la base.

    ★ OFFLINE — con idempotencia explícita
      Se encola como todo lo demás. La foto se guarda local hasta que haya
      señal. `occurred_at` lleva la hora real de la visita.
      ★ `return_uuid` lo GENERA LA APP y hace el POST idempotente. Es necesario
      porque un retorno no tiene identidad natural (a diferencia de `deliver`,
      cuya clave es el order_uuid): el mismo cliente puede devolver lo mismo dos
      veces el mismo día. Sin esa clave, si el servidor procesa y la señal se
      cae antes de que llegue la respuesta, el reintento crearía un DUPLICADO
      con su foto. Con ella, el reintento devuelve 200 con el registro existente.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.14.0 — DESPACHO / APP DE DRIVER (Bloque 4A)
    ══════════════════════════════════════════════════════════════════════════

    ★ ALCANCE: solo el DESPACHO (la ruta y las entregas en la calle).
      El RETORNO DE PRODUCTO (con foto) es el 4B y el RECOGER PAGO el 4C.

    ★ ROL NUEVO: DRIVER
      Usuario propio del WMS, como BODEGUERO. Solo despacha.

    ★ ASIGNACIÓN DIRIGIDA
      El ADMIN asigna un camión ALISTADO a UN driver. Un driver, UN camión a la
      vez. El driver no elige.

    ★ ESTADOS NUEVOS DEL CAMIÓN
        ALISTADO → (admin asigna driver) → ASIGNADO_DRIVER
                 → (driver inicia ruta)  → EN_RUTA
                 → (driver termina ruta) → RUTA_CERRADA

    ★ EL ESTADO DEL PEDIDO SE DERIVA (no lo elige el driver)
      El driver marca qué pasó con la MERCANCÍA; el middleware deduce el
      resultado:
        · nada rechazado           → ENTREGADO
        · algo rechazado           → ENTREGADO_PARCIAL
        · salida rápida de pedido  → NO_ENTREGADO (con motivo de pedido)
      Reusa los mismos estados y motivos del 3A: el driver ahora los registra en
      la calle en vez del admin en el escritorio.

    ★ ORDEN DE PARADAS: el driver reordena SOLO EN SU VISTA
      Puede arrastrar si le conviene por la calle. Recibe un AVISO de que
      cambiar el orden puede afectar el orden en que están cargados los pallets
      — pero NO se le bloquea. El orden guardado por el admin NO cambia.
      Es una preferencia local del dispositivo, no un dato del camión.

    ★ OFFLINE TOTAL — requisito duro
      El driver debe poder trabajar TODA la ruta sin conexión. Al asignarle el
      camión se descarga todo (paradas, pedidos, líneas, clientes, direcciones)
      y lo que registre se encola hasta que haya señal.
      La app AVISA claramente si el driver no ha descargado su ruta.

    ★ ADMIN Y DRIVER COEXISTEN
      El admin puede seguir registrando/corrigiendo entregas desde el Dashboard
      aunque haya driver asignado (el endpoint del 3A ya es idempotente).

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.13.0 — PICKING EN CURSO (Bloque 3C) · cierra el roadmap
    ══════════════════════════════════════════════════════════════════════════

    ★ EL PROBLEMA QUE RESUELVE
      Hoy el admin queda A CIEGAS entre "asigné el camión" y "apareció ALISTADO".
      No sabe si el bodeguero va por la mitad, si se atascó, ni si hay faltantes.
      Con DOS CARRILES es peor: dos personas trabajando y no ve a ninguna.

      Los endpoints /picking/* son del BODEGUERO (filtrados por su token), así
      que el Dashboard no puede usarlos. Este es su equivalente de solo lectura
      bajo /admin/*.

    ★ QUÉ ES
      GET /admin/picking-board — el piso de la bodega de un vistazo: todos los
      camiones activos, con el avance de CADA CARRIL y sus faltantes.

    ★ QUÉ ENTRA
      · Los camiones que se están trabajando: ASIGNADO, EN_PICKING, EN_REPARTICION.
      · Más los ALISTADOS de HOY (para ver lo ya terminado en la jornada).

    ★ POR CARRIL (los dos van a su ritmo, se muestran por separado)
      · quién lo tiene (bodeguero)
      · en qué fase va (LaneStatus)
      · cuánto lleva (fracción de recolección y de repartición)
      · sus FALTANTES CON DETALLE: qué ítem y cuánto faltó — es lo único sobre
        lo que el admin puede ACTUAR mientras el bodeguero trabaja (llamar al
        proveedor, avisar al vendedor).

    ★ PURAMENTE LECTURA. No hay operación ni estado nuevo.
      El Dashboard lo refresca solo (~30s) para ver el movimiento en vivo.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.12.0 — TABLERO DE CARGA (Bloque 3B)
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ ES
      El tablero de PLANIFICACIÓN del admin de bodega: qué hay que despachar
      cada día de la semana, agrupado por shipping code, con las sumatorias y
      —lo accionable— cuántos pedidos YA van en camión y cuántos NO.

    ★ EL EJE: LUNES a VIERNES + columna SIN_DIA
      Sábado y domingo se IGNORAN. Un shipping code configurado solo para fin
      de semana deja sus pedidos sin día asignable → caen en SIN_DIA.

    ★ CADA PEDIDO CAE EN UN SOLO DÍA (no se duplica)
      El PRÓXIMO día de entrega de su shipping code contado DESDE HOY.
      Un shipping code con varios días (ej. martes y viernes) NO reparte sus
      pedidos: todos van al próximo disponible.

    ★ ATRASADOS
      Un pedido que ya existía cuando pasó su día de entrega y no se despachó
      aparece en el próximo día disponible, MARCADO como atrasado. Es la señal
      de que algo se quedó sin sacar.

    ★ SIN_DIA — lo que no cae en ningún día
      · pedidos sin shipping code
      · shipping codes sin días configurados
      · shipping codes configurados solo sábado/domingo

    ★ QUÉ ENTRA
      Todos los pedidos APROBADOS sin entregar. Es un tablero de lo que FALTA
      despachar, no un histórico.

    ★ PURAMENTE LECTURA — no hay operación ni estado nuevo.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.11.0 — ENTREGA (Bloque 3A) · cierre del ciclo del pedido
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ CIERRA
      El camión sale ALISTADO con su manifiesto impreso. El driver entrega y
      regresa. El ADMIN cierra en el Dashboard, PEDIDO POR PEDIDO, el resultado
      real de la entrega. El vendedor lo ve en su app.

    ★ TRES ESTADOS DE ENTREGA (no es binario)
        ENTREGADO           El cliente recibió todo.
        ENTREGADO_PARCIAL   Recibió, pero rechazó ítems (motivo + cantidad por ítem).
        NO_ENTREGADO        No recibió nada (motivo de pedido).

    ★ DOS NIVELES DE RECHAZO
      · Nivel PEDIDO (no se entregó nada):
          NEGOCIO_CERRADO · PEDIDO_CANCELADO
      · Nivel ÍTEM (entregó, pero el cliente rechazó líneas):
          NO_LO_QUIERE · DANADO · SHORT · NO_ORDENADO
        Se registra la CANTIDAD rechazada por ítem, no solo la marca.

    ★ SHORT — matiz a tener presente
      "Llegó menos de lo facturado". Puede venir de un faltante ya conocido del
      picking (is_incomplete_delivery) o ser una discrepancia nueva (se cargó
      completo pero llegó menos). Se registra igual; distinguir el origen es
      analítica futura.

    ★ EL PEDIDO QUEDA CERRADO en ese estado.
      Los ítems rechazados vuelven en el camión → eso es ROUTE RETURN, que
      pertenece a la fase de BIN LOAD (futuro, no aquí).

    ★ SOLO CAMIONES ALISTADOS
      No se cierra la entrega de un camión que no salió → 409.

    ★ LA APP DE DRIVER ES OTRO BLOQUE
      Por ahora el registro es del ADMIN en el Dashboard. Cuando exista la app
      de driver, reusará estos mismos endpoints.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.10.0 — DOS CARRILES DE PICKING (Bloque 2C)
    ══════════════════════════════════════════════════════════════════════════

    ★ EL CAMBIO
      Antes: UN bodeguero por camión picaba todo (regulares + congelados).
      Ahora: DOS bodegueros trabajan el mismo camión EN PARALELO, cada uno su
      tipo. Razón física: los congelados se pican en la NEVERA, los regulares
      en el almacén — dos lugares distintos, dos personas a la vez.

    ★ EL MODELO: dos carriles independientes
        REGULARES  → bodeguero A → recolecta → reparte → pallets "<camión>-Regular-N"
        CONGELADOS → bodeguero B → recolecta → reparte → pallets "<camión>-Frozen-N"
      Cada carril hace su ciclo COMPLETO. No se cruzan.

    ★ ASIGNACIÓN POR TIPO (antes era por camión)
      · POST /admin/trucks/{id}/assign ahora lleva `lane` (REGULAR|FROZEN).
      · SIEMPRE por separado: el mismo bodeguero NO puede tener ambos carriles.
      · Si el camión no tiene congelados, solo existe el carril REGULAR.
      · Reasignable por carril, incluso en curso, conservando el progreso.

    ★ has_frozen — el sistema lo calcula
      El camión expone `has_frozen` (¿tiene ítems con ItemCode que empieza con F?).
      Determina si se esperan 1 o 2 asignaciones. El admin no lo decide a mano.

    ★ ESTADO: global + por carril
      El camión conserva su `status` (informativo, el agregado), y ahora expone
      `lanes` con el avance de cada carril por separado. Con carriles desfasados
      (uno repartiendo, otro recolectando) el admin ve ambos.
      ALISTADO solo cuando TODOS los carriles existentes cerraron.

    ★ VER TODO, OPERAR SOLO LO SUYO
      Cada bodeguero ve el camión completo (contexto), pero solo puede operar su
      carril. Operar el carril ajeno → 403.

    ★ PALLETS: correlativo POR TIPO
      "<camión>-Regular-1, -2" y "<camión>-Frozen-1, -2" (antes era global).

    ★ CUADRE POR CARRIL
      La validación de cuadre se aplica dentro de cada carril, no global.

    ★ FALTANTES EN LA REPARTICIÓN (corrige un bloqueo)
      Antes, un ítem marcado como faltante seguía apareciendo repartible: la app
      lo ofrecía, el middleware lo rechazaba por cuadre, y el pedido no se podía
      completar → flujo BLOQUEADO.
      Ahora la repartición trabaja contra lo RECOGIDO, no contra lo pedido:
        · `available_quantity` por ítem = lo realmente disponible para ese pedido.
        · Faltante TOTAL (nada recogido) → el ítem NO se ofrece (available = 0).
        · Faltante PARCIAL → se ofrece hasta lo disponible; el BODEGUERO decide
          a qué pedidos dárselo (él sabe qué cliente es prioritario).
        · `has_shortage` marca el ítem; `is_incomplete_delivery` marca el pedido
          que no recibirá todo lo que pidió.
        · El cierre sigue exigiendo que todo lo RECOGIDO esté repartido; lo
          pedido-pero-no-recogido ya NO bloquea (es un faltante conocido).

    ★ DESASIGNAR CARRIL (nuevo)
      POST /admin/trucks/{id}/unassign — quita el bodeguero de un carril.
      Cierra un callejón sin salida: antes, un camión ASIGNADO no se podía
      cancelar ni eliminar ni deshacer; solo reasignar a otra persona.
      · Disponible siempre mientras el camión no esté ALISTADO.
      · SE PIERDE el progreso de ese carril (el Dashboard debe avisarlo).
        Para cambiar de persona CONSERVANDO el trabajo, usar `assign`.
      · Si ningún carril queda asignado → el camión vuelve a CONFIRMADO,
        desde donde se puede cancelar o eliminar.

    ★ ELIMINAR CAMIÓN (nuevo)
      ⚠️ CANCELAR ≠ ELIMINAR — son dos acciones distintas, ambas existen:
        · CANCELAR → POST /admin/trucks/{id}/cancel (antes era el DELETE).
          El camión queda CANCELADO y SUS ÓRDENES SE LIBERAN para otro camión.
          Para un camión CON órdenes que ya no se va a despachar.
        · ELIMINAR → DELETE /admin/trucks/{id}. El camión DESAPARECE.
          Solo si NO tiene órdenes y está en BORRADOR, CONFIRMADO o CANCELADO.
          Para un camión vacío armado por error.
      DELETE /admin/trucks/{id} — borrado REAL. Solo si el camión NO tiene
      órdenes y está en BORRADOR, CONFIRMADO o CANCELADO. Para que el admin
      pueda descartar un camión que armó por error. No se borra un camión que
      un bodeguero ya está trabajando, ni uno ALISTADO.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.9.0 — MANIFIESTO DE RUTA (Bloque 2B-2) · cierre del picking
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ ES
      El informe final del camión: los pedidos por parada, con el/los pallet(s)
      de cada uno. Es con lo que el driver entrega. Lo ve el ADMIN en el
      Dashboard (ver e imprimir).

    ★ PURAMENTE LECTURA
      No hay operación ni estado nuevo. Todos los datos ya existen (pedidos,
      pallets, orden de paradas). El manifiesto solo los junta y ordena.

    ★ ORDEN DE ENTREGA (directo, NO inverso)
      El manifiesto va en orden de paradas DIRECTO (parada 1, 2, 3...). El
      inverso era para CARGAR el camión (fondo primero); el manifiesto es para
      ENTREGAR (primero primero). El driver sigue las paradas en orden natural.

    ★ REGLAS
      · Solo para camiones ALISTADOS (repartición cerrada). Si no → 409.
      · Un pedido con congelados está en 2 pallets (frozen + regular): se
        listan todos los pallets del pedido (ej. "Pallets: 1, 3").

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.8.0 — PICKING FASE 2: repartición + pallets (Bloque 2B-1)
    ══════════════════════════════════════════════════════════════════════════

    ★ ALCANCE: la REPARTICIÓN de lo recogido entre los pedidos, y el ARMADO de
      PALLETS. Van juntos porque la repartición se hace SOBRE los pallets.
      El Manifiesto de Ruta es el Bloque 2B-2 (informe final, aparte).

    ★ PRECONDICIÓN
      La recolección (2A) debe estar COMPLETA. No se reparte lo que no se recogió.
      Nueva transición: EN_PICKING → EN_REPARTICION (cuando arranca la fase 2).

    ★ EL PALLET
      · Identificado por: nombre del camión + correlativo (ej. "Queens-1").
      · Tipo: FROZEN o REGULAR. NUNCA mezclan. Un pedido con congelados usa
        mínimo 2 pallets (uno frozen, uno regular).
      · Contiene asignaciones (ítem, cantidad, pedido). Muchos-a-muchos: un
        pallet tiene varios pedidos; un pedido puede estar en varios pallets
        (el frozen aparte, o porque no cupo por peso/altura).
      · El bodeguero puede CREAR pallets nuevos sobre la marcha (cuando el
        sugerido se llena — juzga a ojo; el cálculo de peso/volumen es futuro,
        cuando SAP tenga esos datos).

    ★ LA REPARTICIÓN GUIADA
      · La app lleva PEDIDO POR PEDIDO, en orden de paradas INVERSO (lo último
        en entregarse se carga primero, al fondo del camión).
      · Por cada ítem del pedido: la app dice cuánto va (de lo recogido). El
        bodeguero lo asigna a un pallet y CONFIRMA cada asignación
        (ítem→pedido→pallet), no espera al cierre del pallet.
      · Frozen → pallet frozen; regular → pallet regular (automático por tipo).

    ★ REGLA DE CUADRE (la vigila el middleware)
      Lo repartido de un ítem debe coincidir con lo recogido (menos faltantes).
      Ni sobra ni falta. La app sabe cuánto queda por repartir de cada ítem y no
      deja cerrar hasta que cuadre. Evita el error clásico del wave picking.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.7.0 — PICKING FASE 1: recolección (Bloque 2A)
    ══════════════════════════════════════════════════════════════════════════

    ★ ALCANCE: solo la RECOLECCIÓN consolidada (wave picking fase 1).
      La repartición entre pedidos, pallets y manifiesto son el Bloque 2B.

    ★ ROL NUEVO: BODEGUERO
      Usuario propio del WMS (no de SAP). Solo pica. No arma camiones ni configura.
      Para 2A se crean bodegueros de prueba por seed (la gestión de usuarios es
      un bloque aparte).

    ★ ASIGNACIÓN DIRIGIDA (no autoservicio)
      El ADMIN asigna un camión CONFIRMADO+con-ruta a UN bodeguero (Dashboard).
      El bodeguero solo ve los camiones que le asignaron. Puede reasignarse a
      otro bodeguero, incluso durante el picking, CONSERVANDO el progreso.
      ★ El progreso de recolección es del CAMIÓN, no del bodeguero — para que
      la reasignación no pierda trabajo.

    ★ ESTADOS DEL CAMIÓN (ampliados)
        CONFIRMADO → (admin asigna) → ASIGNADO → (bodeguero inicia) → EN_PICKING
      Se congela (admin ya no toca órdenes/ruta) al entrar EN_PICKING.

    ★ RECOLECCIÓN CONSOLIDADA (wave, fase 1)
      · DOS listas: REGULARES (ItemCode no empieza con F) y CONGELADOS (empieza
        con F, se recogen en nevera).
      · Por ítem: total a recoger (sumado del camión) + bins con stock.
      · El bodeguero elige bin (la app muestra dónde hay). Configurable a futuro
        para picking dirigido.
      · Confirma cantidad. Registra faltantes. Stock = foto del inicio.
      · Pausar y retomar: el progreso persiste.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.6.0 — ORDEN DE PARADAS (OptimoRoute vía CSV) · Bloque 1.5
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ RESUELVE

      Un camión, antes de picarse, necesita saber EN QUÉ ORDEN se entregan sus
      paradas. Ese cálculo lo hace OptimoRoute (sistema externo). Por ahora la
      comunicación es por CSV manual (export/import); a futuro, por API.

    ★ EL FLUJO

      1. EXPORTAR (Dashboard): genera el CSV de un camión CONFIRMADO,
         AGRUPADO POR CLIENTE (una parada por cliente, no por pedido).
         · Order # = client_code (OptimoRoute acepta alfanumérico)
         · Dirección del CLIENTE (de OCRD, vía vw_WMS_Clients)
         · Subtotal = suma de los pedidos de ese cliente en el camión
         · Columnas: Order Date, Order #, Sales Rep, Customer Name, Address,
           City, Zip Code, Delivery Window From/To, Weight, Subtotal, Shipping Code
         · Marca los clientes con dirección/zip INCOMPLETO (aviso, no bloqueo).

      2. El admin sube el CSV a OptimoRoute (fuera del sistema).

      3. IMPORTAR (Dashboard → middleware): el admin sube el CSV que devuelve
         OptimoRoute (trae una columna Stop # con el orden). El middleware
         empareja cada fila por client_code y guarda el Stop # de cada cliente.
         Ese Stop # se aplica a TODOS los pedidos de ese cliente en el camión.

    ★ REGLAS

      · Una PARADA = un CLIENTE (aunque tenga varios pedidos en el camión).
      · El orden de paradas es RE-IMPORTABLE (subir un CSV corregido), mientras
        el camión no haya empezado el picking.
      · Para el Bloque 2: un camión NO se puede picar sin orden de paradas.
        (Un pedido suelto FUERA DE RUTA sí se podrá picar sin camión — eso es
        del Bloque 2, no de aquí.)

    ★ NO INCLUYE

      La integración por API con OptimoRoute (futuro). Solo CSV manual.
      El picking en sí (Bloque 2).

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.5.0 — CAMIONES (armado de despachos) · BLOQUE 1 del picking
    ══════════════════════════════════════════════════════════════════════════

    ★ NUEVO CONCEPTO: EL CAMIÓN

      Un CAMIÓN es un grupo de órdenes APROBADAS que se despachan (y luego se
      pican) juntas. Lo arma el ADMINISTRADOR DE BODEGA desde el Dashboard,
      cada mañana.

      ⚠️ SE AGRUPA POR SHIPPING CODE, NO POR RUTA.
        · RUTA (U_RSAP_ROUTE) es un eje COMERCIAL (para vendedores). NO es
          logística. No se usa para camiones.
        · SHIPPING CODE (U_RSAP_SHIPPING_CODE) es el eje LOGÍSTICO: zonas
          geográficas de reparto (BNX3, BRK1, QNS2...). Su nombre vive en la
          tabla [@RSAP_SHIPPING_CODE]. ES el criterio de agrupación de camiones.

      Flujo:
        · Las órdenes aprobadas heredan el SHIPPING CODE de su cliente.
        · El admin las ve agrupadas por shipping code y ARMA CAMIONES.
        · Normalmente un camión = un shipping code, pero puede mezclar varios.
        · Una orden aprobada puede quedar SIN camión ese día (queda marcada).

      DÍA DE ENTREGA: cada shipping code se entrega uno o varios días de la
      semana. Ese dato NO está en SAP: lo configura el admin en el Dashboard
      (dato del middleware). Sirve para agrupar/ver la carga por día.

    ★ ESTADOS DEL CAMIÓN

        BORRADOR    El admin lo está armando. Agrega/quita órdenes libremente.
        CONFIRMADO  Listo para picar. Aún modificable.
        EN_PICKING  El bodeguero empezó. ★ SE CONGELA: ya no se modifica.
        ALISTADO    Picking terminado. (Bloque 2)
        CANCELADO   El admin lo deshizo; sus órdenes vuelven a "sin camión".

      Transiciones válidas:
        BORRADOR    → CONFIRMADO | CANCELADO
        CONFIRMADO  → EN_PICKING | BORRADOR | CANCELADO
        EN_PICKING  → ALISTADO            (Bloque 2, la app de bodega)
        (una transición inválida → 409)

    ★ ALCANCE DE ESTA VERSIÓN (Bloque 1)

      SOLO el armado de camiones (Dashboard + middleware). El PICKING en sí
      (la app de bodega, el wave, la repartición) es el Bloque 2 — NO se
      implementa aquí. Por eso EN_PICKING/ALISTADO se definen pero el camión
      llega como mucho a CONFIRMADO en esta versión.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.4.1 — LA APP SE ENTERA DE LA DECISIÓN DEL ADMIN
    ══════════════════════════════════════════════════════════════════════════

    Hasta v0.4.0, POST /orders devolvía el estado de la orden UNA SOLA VEZ, al
    momento de recibirla. Si quedaba RETENIDA_CARTERA, la app nunca volvía a
    preguntar -- el vendedor no se enteraba cuando el admin la aprobaba o
    rechazaba despues.

    GET /sync/orders (nuevo, sync-down) cierra ese ciclo: el vendedor descarga
    el estado ACTUAL de sus propias órdenes (status, hold_reason,
    decision_note, decided_at), incremental por `since` igual que
    /sync/catalog y /sync/clients. Deliberadamente liviano: no repite lo que
    la app ya tiene (client_name, lines, total_amount...), solo lo que puede
    cambiar DESPUÉS de que la orden ya fue aceptada.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.4.1 — SEGUIMIENTO DEL ESTADO DE LA ORDEN
    ══════════════════════════════════════════════════════════════════════════

    ★ EL PROBLEMA QUE RESUELVE

      Hasta v0.4.0, POST /orders era una FOTO ÚNICA: la app guardaba el estado
      que devolvía y nunca lo volvía a consultar. Cuando el admin aprobaba o
      rechazaba una orden retenida, EL VENDEDOR NUNCA SE ENTERABA — su orden
      se quedaba en "Retenida" para siempre.

      Eso rompía el propósito del módulo de cartera: el vendedor debe poder
      decirle a su cliente "tu pedido no procedió porque tienes facturas
      vencidas".

    ★ LA SOLUCIÓN

      1) GET /sync/orders?since=...  (NUEVO)
         La app descarga el estado ACTUAL de sus órdenes ya enviadas.
         Incremental. Filtrado por el vendedor del token.
         Devuelve OrderStatusUpdate (liviano: NO repite líneas, cliente ni
         totales — la app ya los tiene localmente).

      2) decided_by / decided_at / decision_note EN OrderSummary
         (antes solo estaban en OrderDetail)
         Así la GRILLA del Dashboard puede mostrar el motivo del rechazo sin
         tener que abrir el detalle de cada orden.
         Se heredan en OrderDetail y HeldOrder vía allOf.

    ★ BASE PARA EL FUTURO

      GET /sync/orders es el cimiento del seguimiento del ciclo de vida de la
      orden. Cuando lleguen picking, facturación y entrega, el vendedor va a
      querer saber en qué va su pedido — y este es el canal.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.4.0 — CARTERA Y RETENCIÓN DE ÓRDENES
    ══════════════════════════════════════════════════════════════════════════

    1) DATOS DE CARTERA EN EL CLIENTE

       Cada cliente ahora trae su información de crédito, para que la app pueda
       ADVERTIR al vendedor OFFLINE:
         · balance          — saldo actual (de SAP)
         · credit_limit     — cupo
         · credit_available — cupo disponible
         · overdue_count / overdue_amount / max_days_overdue — mora

    2) ESTADO DE CUENTA DEL CLIENTE (nuevo endpoint)

       GET /clients/{client_code}/statement — facturas, notas de crédito y
       pagos a cuenta pendientes. Lo baja la app para verlo offline.

    3) MÁQUINA DE ESTADOS DE LA ORDEN (¡inaugurada aquí!)

       Hasta v0.3.0 toda orden llegaba a SINCRONIZADA y ahí moría.
       Ahora:

         SINCRONIZADA ──(cartera OK)──────────────────► APROBADA
              │
              └──(excede cupo o tiene mora)──► RETENIDA_CARTERA
                                                    │
                                     ┌──────────────┴──────────────┐
                                     ▼                             ▼
                                 APROBADA                     RECHAZADA
                             (admin aprueba)              (admin rechaza)

       La evaluación la hace el MIDDLEWARE al recibir la orden.

    4) LA REGLA DE RETENCIÓN

       Una orden se RETIENE si:
         (a) balance + total_de_la_orden > credit_limit   → excede cupo
         (b) max_days_overdue > 5                          → mora

       Los 5 días de gracia viven en appsettings del middleware (ajustables
       sin recompilar). Son iguales para todos los clientes.

    5) LA APP ADVIERTE, EL MIDDLEWARE DECIDE

       La app evalúa la regla LOCALMENTE (offline, con datos de la última
       sincronización) y ADVIERTE al vendedor: "esta orden quedará retenida".

       Pero NUNCA lo bloquea. El vendedor decide y sigue.

       El middleware vuelve a evaluar con datos FRESCOS al recibirla.
       Los veredictos pueden diferir (el saldo cambió desde la última sync) y
       eso está bien: la advertencia es informativa, la decisión es del servidor.

    6) ENDPOINTS DE APROBACIÓN (Dashboard)

       GET  /admin/orders/held          — órdenes retenidas por cartera
       POST /admin/orders/{uuid}/approve — aprobar
       POST /admin/orders/{uuid}/reject  — rechazar

    ══════════════════════════════════════════════════════════════════════════
    Fuera de alcance (NO implementar): pagos, créditos (notas), visitas,
    gastos, promociones, picking, Deliveries, facturación a SAP.

servers:
  - url: https://api.dinas-wms.example.com/v1
    description: Middleware. El path base es /v1.

tags:
  - name: auth
  - name: sync-down
  - name: sync-up
  - name: credit
  - name: admin
  - name: trucks
    description: Armado de camiones (despachos) por el administrador de bodega.
  - name: shipping-codes
    description: Zonas logísticas de entrega y sus días de la semana.
  - name: route-stops
    description: Orden de paradas de un camión (OptimoRoute vía CSV).
  - name: picking-admin
    description: Asignación de camiones a bodegueros (admin).
  - name: picking
    description: Recolección del bodeguero (rol BODEGUERO).
  - name: distribution
    description: Repartición en pallets (fase 2 del picking).
  - name: manifest
    description: Manifiesto de Ruta (informe final de entrega).
  - name: delivery
    description: Registro del resultado de la entrega (Bloque 3A).
  - name: workload
    description: Tablero de carga por día y shipping code (Bloque 3B).
  - name: dispatch-admin
    description: Asignación de camiones a drivers (Bloque 4A).
  - name: dispatch
    description: Despacho en la calle — la app del driver (Bloque 4A).
  - name: returns
    description: Retorno de producto desde la ruta (Bloque 4B).
  - name: payments
    description: Pagos recogidos en ruta (Bloque 4C).
  - name: payments-admin
    description: Pagos vistos por el admin (Bloque 4C).
  - name: returns-admin
    description: Retornos vistos por el admin (Bloque 4B).

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Login por usuario y contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Autenticación correcta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /sync/catalog:
    get:
      tags: [sync-down]
      summary: Catálogo con los 3 precios (vendedor)
      description: >
        Solo llegan ítems con SellItem='Y' en SAP.
        Un precio de 0 es VÁLIDO y el ítem ES ORDENABLE (muestra / publicidad).
        `available` viene YA CALCULADO por el middleware.
      parameters:
        - $ref: '#/components/parameters/Since'
      responses:
        '200':
          description: Lista de ítems (delta)
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_time: { type: string, format: date-time }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /sync/clients:
    get:
      tags: [sync-down]
      summary: Clientes del vendedor, CON SUS DATOS DE CARTERA
      description: >
        Solo los clientes ASIGNADOS al vendedor del token.

        ★ v0.4.0: cada cliente incluye ahora su información de CRÉDITO
        (balance, cupo, mora). La app la usa para ADVERTIR offline.
      parameters:
        - $ref: '#/components/parameters/Since'
      responses:
        '200':
          description: Lista de clientes (delta)
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_time: { type: string, format: date-time }
                  clients:
                    type: array
                    items: { $ref: '#/components/schemas/Client' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /sync/orders:
    get:
      tags: [sync-down]
      summary: Estado ACTUAL de las órdenes del vendedor (delta)
      description: >
        ★ NUEVO en v0.4.1.

        POST /orders devuelve el estado de la orden UNA SOLA VEZ, al momento
        de recibirla. Si el admin la aprueba o rechaza DESPUÉS, la app nunca
        se enteraba -- este endpoint cierra ese ciclo.

        Solo las órdenes del vendedor del token (mismo filtro que
        /sync/clients). Incremental por `since`, igual que /sync/catalog y
        /sync/clients: trae tanto órdenes nuevas como las que cambiaron de
        estado desde la última sincronización.

        Deliberadamente liviano -- no repite lo que la app ya tiene de cuando
        envió la orden (client_name, lines, total_amount...), solo lo que
        puede cambiar DESPUÉS: status, hold_reason, decision_note, decided_at.
      parameters:
        - $ref: '#/components/parameters/Since'
      responses:
        '200':
          description: Órdenes del vendedor (delta)
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_time: { type: string, format: date-time }
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/OrderStatusUpdate' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /clients/{client_code}/statement:
    get:
      tags: [credit]
      summary: Estado de cuenta del cliente (facturas, NC, pagos)
      description: >
        ★ NUEVO en v0.4.0.

        Documentos pendientes del cliente. La app lo baja para que el vendedor
        pueda consultarlo OFFLINE al visitar al cliente.

        · INVOICE            → open_amount POSITIVO (el cliente debe)
        · CREDIT_NOTE        → open_amount NEGATIVO (resta deuda)
        · PAYMENT_ON_ACCOUNT → open_amount NEGATIVO (resta deuda)

        NOTA: la suma del detalle se APROXIMA al `balance`, pero puede diferir
        por ajustes contables. **El `balance` es la cifra oficial**; el detalle
        la desglosa. Es una herramienta comercial, no una auditoría contable.

        El vendedor solo puede consultar SUS clientes (403 si no es suyo).
      parameters:
        - name: client_code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Estado de cuenta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientStatement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: El cliente no está asignado a este vendedor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders:
    post:
      tags: [sync-up]
      summary: Enviar una orden tomada por el vendedor
      description: >
        Idempotente por 'client_uuid'. UUID ya registrado → 200 con la orden
        existente (sin duplicar). UUID nuevo → 201.

        ★ v0.4.0: el middleware EVALÚA LA CARTERA al recibir la orden.
        La respuesta indica en qué estado quedó:
          · APROBADA          → cartera OK, la orden sigue su curso
          · RETENIDA_CARTERA  → excede cupo o tiene mora; espera al admin

        El campo `hold_reason` explica POR QUÉ se retuvo (para mostrárselo al
        vendedor).

        `unit_price = 0` y `line_discount_pct = 100` son VÁLIDOS.
        `price_list` debe estar entre las autorizadas del cliente (si no → 400).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreate' }
      responses:
        '201':
          description: Orden creada (ver `status` para saber si quedó retenida)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderAccepted' }
        '200':
          description: Orden ya existente (reintento idempotente)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/orders:
    get:
      tags: [admin]
      summary: Grilla de órdenes recibidas
      description: REQUIERE rol ADMIN.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: salesperson_code
          in: query
          schema: { type: string }
        - name: client_code
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
          description: ★ v0.4.0 — filtrar por estado.
      responses:
        '200':
          description: Página de órdenes
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
                  held_count:
                    type: integer
                    description: >
                      ★ Cuántas órdenes están RETENIDA_CARTERA en total
                      (no solo en esta página). Para el aviso del Dashboard.
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/OrderSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/orders/held:
    get:
      tags: [admin]
      summary: Órdenes RETENIDAS por cartera (bandeja de aprobación)
      description: >
        ★ NUEVO en v0.4.0. REQUIERE rol ADMIN.

        Atajo de /admin/orders?status=RETENIDA_CARTERA, pero enriquecido:
        cada orden trae el CONTEXTO DE CARTERA del cliente (saldo, cupo, mora,
        cuánto viene de Sage) para que el admin pueda decidir sin salir de aquí.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Órdenes retenidas con su contexto de cartera
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/HeldOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/orders/{client_uuid}:
    get:
      tags: [admin]
      summary: Detalle de una orden con sus líneas
      description: REQUIERE rol ADMIN.
      parameters:
        - name: client_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Orden con detalle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/orders/{client_uuid}/approve:
    post:
      tags: [admin]
      summary: APROBAR una orden retenida
      description: >
        ★ NUEVO en v0.4.0. REQUIERE rol ADMIN.

        RETENIDA_CARTERA → APROBADA.

        Solo se puede aprobar una orden que esté RETENIDA_CARTERA.
        Si ya está APROBADA o RECHAZADA → 409 (conflicto de estado).

        Queda registro de QUIÉN aprobó y CUÁNDO.
      parameters:
        - name: client_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  description: Nota del aprobador (opcional, queda en el registro).
      responses:
        '200':
          description: Orden aprobada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La orden no está en un estado que permita aprobarla
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/orders/{client_uuid}/reject:
    post:
      tags: [admin]
      summary: RECHAZAR una orden retenida
      description: >
        ★ NUEVO en v0.4.0. REQUIERE rol ADMIN.

        RETENIDA_CARTERA → RECHAZADA.

        El MOTIVO es OBLIGATORIO: el vendedor debe poder explicarle al cliente
        por qué su pedido no procedió.

        Si ya está APROBADA o RECHAZADA → 409.
      parameters:
        - name: client_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  description: >
                    Motivo del rechazo. OBLIGATORIO.
                    El vendedor lo verá y podrá explicárselo al cliente.
      responses:
        '200':
          description: Orden rechazada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La orden no está en un estado que permita rechazarla
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/catalog:
    get:
      tags: [admin]
      summary: Catálogo completo con los 3 precios
      description: REQUIERE rol ADMIN. Incluye los ítems a $0.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          schema: { type: string }
        - name: only_without_price
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Página de ítems
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
                  without_price_count: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminCatalogItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/clients:
    get:
      tags: [admin]
      summary: Todos los clientes, con listas autorizadas y CARTERA
      description: REQUIERE rol ADMIN.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          schema: { type: string }
        - name: only_overdue
          in: query
          schema: { type: boolean, default: false }
          description: ★ v0.4.0 — solo clientes con mora (>5 días).
      responses:
        '200':
          description: Página de clientes
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
                  overdue_count:
                    type: integer
                    description: ★ Cuántos clientes tienen mora (en total).
                  clients:
                    type: array
                    items: { $ref: '#/components/schemas/AdminClient' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/clients/{client_code}/price-list:
    put:
      tags: [admin]
      summary: Autorizar (o quitar) la lista de precios adicional
      description: REQUIERE rol ADMIN.
      parameters:
        - name: client_code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [additional_price_list]
              properties:
                additional_price_list:
                  type: integer
                  enum: [1, 2, 3]
                  nullable: true
      responses:
        '200':
          description: Autorización actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminClient' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/clients/{client_code}/statement:
    get:
      tags: [admin]
      summary: Estado de cuenta del cliente (vista admin)
      description: >
        ★ NUEVO en v0.4.0. REQUIERE rol ADMIN.
        Igual que /clients/{code}/statement pero SIN el filtro de vendedor:
        el admin puede consultar cualquier cliente.
      parameters:
        - name: client_code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Estado de cuenta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientStatement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/trucks:
    get:
      tags: [trucks]
      summary: Lista de camiones
      description: REQUIERE rol ADMIN. Filtrable por estado.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TruckStatus' }
        - name: date
          in: query
          schema: { type: string, format: date }
          description: >
            Camiones CREADOS en esta fecha (created_at), por defecto hoy.
            Es la fecha de creación = el día de trabajo del admin, NO una fecha
            de entrega.
      responses:
        '200':
          description: Lista de camiones
          content:
            application/json:
              schema:
                type: object
                properties:
                  trucks:
                    type: array
                    items: { $ref: '#/components/schemas/TruckSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [trucks]
      summary: Crear un camión (vacío, en BORRADOR)
      description: >
        REQUIERE rol ADMIN. Crea un camión vacío que el admin irá llenando
        con órdenes. Empieza en estado BORRADOR.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Nombre/etiqueta opcional (ej. "Camión 1 - Ruta 11").
                note: { type: string }
      responses:
        '201':
          description: Camión creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/trucks/available-orders:
    get:
      tags: [trucks]
      summary: Órdenes APROBADAS disponibles para armar camiones
      description: >
        REQUIERE rol ADMIN.
        Órdenes en estado APROBADA que NO están en ningún camión activo
        (sin asignar). Agrupadas por SHIPPING CODE (el eje logístico), para que
        el admin las monte en camiones.
      parameters:
        - name: shipping_code
          in: query
          schema: { type: integer }
          description: Filtrar por shipping code (el eje logístico).
        - name: delivery_day
          in: query
          schema: { $ref: '#/components/schemas/WeekDay' }
          description: >
            Filtrar por día de entrega. Usa la config de días por shipping code.
      responses:
        '200':
          description: Órdenes disponibles, agrupadas por shipping code
          content:
            application/json:
              schema:
                type: object
                properties:
                  shipping_codes:
                    type: array
                    description: Resumen por shipping code (sin asignar).
                    items:
                      type: object
                      properties:
                        shipping_code: { type: integer }
                        shipping_code_name: { type: string }
                        delivery_days:
                          type: array
                          items: { $ref: '#/components/schemas/WeekDay' }
                          description: Días configurados para este shipping code.
                        order_count: { type: integer }
                        item_total:
                          type: integer
                          description: Suma de unidades de todas las órdenes.
                        total_amount: { type: number, format: double }
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/OrderSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/trucks/{truck_id}:
    get:
      tags: [trucks]
      summary: Detalle de un camión con sus órdenes
      description: REQUIERE rol ADMIN.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Camión con sus órdenes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [trucks]
      summary: Eliminar un camión
      description: >
        ★ v0.10.0 — REQUIERE rol ADMIN. Borra el camión definitivamente.
        REGLAS:
          · Solo si NO tiene órdenes asignadas (hay que quitarlas antes) → 409 si tiene.
          · Solo en estado BORRADOR, CONFIRMADO o CANCELADO → 409 en cualquier otro.
            Quedan FUERA: ASIGNADO, EN_PICKING, EN_REPARTICION (un bodeguero ya está
            trabajando el camión) y ALISTADO (ya se picó; su manifiesto puede estar
            impreso y en ruta).
        Es un borrado REAL: el camión desaparece, junto con su orden de paradas y
        asignaciones de carril.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Camión eliminado
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            El camión tiene órdenes, o su estado no permite borrarlo (solo
            BORRADOR, CONFIRMADO o CANCELADO son borrables).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/trucks/{truck_id}/cancel:
    post:
      tags: [trucks]
      summary: Cancelar un camión
      description: >
        REQUIERE rol ADMIN. Cancela el camión (estado CANCELADO).
        Sus órdenes vuelven a "sin asignar" (no se pierden) y pueden montarse
        en otro camión.
        NO se puede cancelar un camión EN_PICKING o ALISTADO → 409.
        ★ v0.10.0 — Antes era DELETE /admin/trucks/{id}; se movió a POST .../cancel
        para liberar el DELETE, que ahora es el BORRADO REAL (otra acción).
        CANCELAR ≠ ELIMINAR: cancelar conserva el camión y libera sus órdenes;
        eliminar lo hace desaparecer (y exige que no tenga órdenes).
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Camión cancelado; órdenes liberadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión ya está en picking o alistado; no se puede cancelar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/trucks/{truck_id}/orders:
    post:
      tags: [trucks]
      summary: Agregar órdenes a un camión
      description: >
        REQUIERE rol ADMIN.
        Solo si el camión está en BORRADOR o CONFIRMADO (no EN_PICKING → 409).
        Las órdenes deben estar APROBADAS y sin asignar a otro camión (si no → 400).
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_uuids]
              properties:
                order_uuids:
                  type: array
                  items: { type: string, format: uuid }
                  minItems: 1
      responses:
        '200':
          description: Órdenes agregadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión está congelado (EN_PICKING/ALISTADO)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/trucks/{truck_id}/orders/{order_uuid}:
    delete:
      tags: [trucks]
      summary: Quitar una orden de un camión
      description: >
        REQUIERE rol ADMIN. La orden vuelve a "sin asignar".
        Solo si el camión NO está EN_PICKING/ALISTADO → 409.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: order_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Orden removida del camión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión está congelado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/trucks/{truck_id}/confirm:
    post:
      tags: [trucks]
      summary: Confirmar un camión (BORRADOR → CONFIRMADO)
      description: >
        REQUIERE rol ADMIN. Marca el camión como listo para picar.
        Debe tener al menos una orden (si está vacío → 400).
        Sigue siendo modificable tras confirmar (hasta que empiece el picking).
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Camión confirmado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDetail' }
        '400':
          description: El camión está vacío
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión no está en un estado que permita confirmarlo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/shipping-codes:
    get:
      tags: [shipping-codes]
      summary: Shipping codes con su día(s) de entrega configurado(s)
      description: >
        REQUIERE rol ADMIN.
        Lista los shipping codes (de SAP: código + nombre) con los días de
        entrega que el admin les configuró (dato del middleware).
      responses:
        '200':
          description: Lista de shipping codes con sus días
          content:
            application/json:
              schema:
                type: object
                properties:
                  shipping_codes:
                    type: array
                    items: { $ref: '#/components/schemas/ShippingCodeConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/shipping-codes/{code}/delivery-days:
    put:
      tags: [shipping-codes]
      summary: Configurar los días de entrega de un shipping code
      description: >
        REQUIERE rol ADMIN.
        Define en qué día(s) de la semana se entrega este shipping code.
        Puede ser uno o varios. Lista vacía = sin días configurados.
        Este dato vive en el MIDDLEWARE (no en SAP).
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delivery_days]
              properties:
                delivery_days:
                  type: array
                  items: { $ref: '#/components/schemas/WeekDay' }
                  description: Días de entrega (puede ser varios, o vacío).
      responses:
        '200':
          description: Días actualizados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShippingCodeConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/trucks/{truck_id}/route-export:
    get:
      tags: [route-stops]
      summary: Datos del camión para exportar a OptimoRoute (agrupado por cliente)
      description: >
        REQUIERE rol ADMIN.
        Devuelve las paradas del camión AGRUPADAS POR CLIENTE (una por cliente,
        aunque tenga varios pedidos). El Dashboard arma el CSV con esto.
        Marca los clientes con dirección/zip incompleto (aviso, no bloquea).
        El camión debe estar CONFIRMADO.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Paradas del camión, listas para el CSV
          content:
            application/json:
              schema:
                type: object
                properties:
                  truck_id: { type: string, format: uuid }
                  truck_name: { type: string, nullable: true }
                  stops:
                    type: array
                    items: { $ref: '#/components/schemas/RouteExportStop' }
                  incomplete_count:
                    type: integer
                    description: Cuántas paradas tienen dirección/zip incompleto.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión no está confirmado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/trucks/{truck_id}/route-import:
    post:
      tags: [route-stops]
      summary: Importar el orden de paradas devuelto por OptimoRoute
      description: >
        REQUIERE rol ADMIN.
        El admin sube el CSV que devolvió OptimoRoute (parseado a JSON por el
        Dashboard, o el CSV crudo). Cada entrada trae el client_code (Order #)
        y su Stop #. El middleware empareja por client_code y guarda el orden.
        Aplica el Stop # a todos los pedidos de ese cliente en el camión.
        RE-IMPORTABLE: reemplaza el orden anterior. Solo si el camión NO ha
        empezado el picking (si no → 409).
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stops]
              properties:
                stops:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [client_code, stop_number]
                    properties:
                      client_code:
                        type: string
                        description: El Order # del CSV (= client_code).
                      stop_number:
                        type: integer
                        description: El Stop # que asignó OptimoRoute.
      responses:
        '200':
          description: Orden de paradas guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckRoute' }
        '400':
          description: >
            CSV inválido, o client_codes que no están en el camión, o Stop #
            duplicados/faltantes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión ya está en picking; no se puede re-importar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/trucks/{truck_id}/route:
    get:
      tags: [route-stops]
      summary: Ver el orden de paradas actual del camión
      description: REQUIERE rol ADMIN. El orden guardado (si existe).
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: El orden de paradas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckRoute' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El camión no existe o no tiene orden de paradas aún
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/warehouse-workers:
    get:
      tags: [picking-admin]
      summary: Lista de bodegueros (para asignar camiones)
      description: >
        REQUIERE rol ADMIN. Los usuarios con rol BODEGUERO, para que el admin
        elija a quién asignar un camión. (En 2A son bodegueros de prueba por seed.)
      responses:
        '200':
          description: Lista de bodegueros
          content:
            application/json:
              schema:
                type: object
                properties:
                  workers:
                    type: array
                    items:
                      type: object
                      properties:
                        username: { type: string }
                        display_name: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/trucks/{truck_id}/assign:
    post:
      tags: [picking-admin]
      summary: Asignar (o reasignar) un camión a un bodeguero
      description: >
        REQUIERE rol ADMIN.
        ★ v0.10.0 — Asigna un CARRIL del camión a un bodeguero. El camión debe
        estar CONFIRMADO con orden de paradas (has_route).
        Reglas:
          · `lane` indica qué carril se asigna (REGULAR o FROZEN).
          · El mismo bodeguero NO puede tener ambos carriles del mismo camión
            → 400. Siempre se asignan por separado.
          · El carril FROZEN solo se puede asignar si has_frozen es true → 400.
          · REASIGNABLE por carril, incluso en curso; el progreso SE CONSERVA
            (es del camión + carril, no del bodeguero).
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_username, lane]
              properties:
                worker_username: { type: string }
                lane:
                  $ref: '#/components/schemas/PickingLane'
      responses:
        '200':
          description: Camión asignado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDetail' }
        '400':
          description: >
            El bodeguero no existe; el camión no tiene ruta; el bodeguero ya
            tiene el OTRO carril de este camión; o se pidió FROZEN en un camión
            sin congelados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión no está en un estado asignable (ej. BORRADOR/ALISTADO)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /picking/my-trucks:
    get:
      tags: [picking]
      summary: Los camiones asignados al bodeguero (del token)
      description: >
        REQUIERE rol BODEGUERO. Solo los camiones donde ESTE bodeguero tiene un
        carril asignado. Sin asignación, lista vacía.
        ★ v0.10.0 — Cada entrada indica `my_lane`: el carril que le toca a este
        bodeguero en ese camión. Ve el camión completo (contexto) pero solo
        opera su carril.
      responses:
        '200':
          description: Camiones del bodeguero
          content:
            application/json:
              schema:
                type: object
                properties:
                  trucks:
                    type: array
                    items: { $ref: '#/components/schemas/PickingTruckSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /picking/trucks/{truck_id}/start:
    post:
      tags: [picking]
      summary: Iniciar el picking de un camión (ASIGNADO → EN_PICKING)
      description: >
        REQUIERE rol BODEGUERO con un carril asignado en este camión.
        ★ v0.10.0 — Inicia SU CARRIL (el carril pasa a EN_PICKING). Congela el
        camión para el admin. Idempotente.
        Devuelve la lista de recolección DE SU CARRIL solamente.
        Si el bodeguero no tiene carril en este camión → 403.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Picking iniciado, con las listas de recolección
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickingCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: El camión no está asignado a este bodeguero
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /picking/trucks/{truck_id}/collection:
    get:
      tags: [picking]
      summary: Las listas de recolección consolidada del camión
      description: >
        REQUIERE rol BODEGUERO con carril en este camión.
        ★ v0.10.0 — Devuelve la lista de recolección DE SU CARRIL (regulares o
        congelados, según el carril que le tocó), con el total a recoger por
        ítem, los bins con stock, y su progreso. Para PAUSAR/RETOMAR.
        Puede incluir el resumen del otro carril como CONTEXTO (solo lectura),
        pero el bodeguero no lo opera.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Las listas de recolección con progreso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickingCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /picking/trucks/{truck_id}/collect:
    post:
      tags: [picking]
      summary: Registrar la recolección de un ítem (de un bin)
      description: >
        REQUIERE rol BODEGUERO con carril en este camión.
        Confirma cuánto recogió de un ítem, de qué bin. Idempotente por
        (item_code, bin_code).
        ★ v0.10.0 — El ítem debe pertenecer AL CARRIL del bodeguero. Intentar
        recoger un ítem del otro carril → 403.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_code, bin_code, quantity]
              properties:
                item_code: { type: string }
                bin_code:
                  type: string
                  description: El bin de donde tomó (o is_system_bin si sin ubicar).
                quantity:
                  type: number
                  format: double
                  description: Cuánto recogió de ESTE bin.
      responses:
        '200':
          description: Recolección registrada; devuelve el progreso del ítem
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickingItemProgress' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /picking/trucks/{truck_id}/shortage:
    post:
      tags: [picking]
      summary: Registrar un faltante de un ítem
      description: >
        REQUIERE rol BODEGUERO con carril en este camión. Marca que no había
        stock suficiente de un ítem.
        ★ v0.10.0 — El ítem debe pertenecer AL CARRIL del bodeguero → 403 si no.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_code, missing_quantity]
              properties:
                item_code: { type: string }
                missing_quantity: { type: number, format: double }
                note: { type: string }
      responses:
        '200':
          description: Faltante registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickingItemProgress' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /picking/trucks/{truck_id}/start-distribution:
    post:
      tags: [distribution]
      summary: Iniciar la repartición (EN_PICKING → EN_REPARTICION)
      description: >
        REQUIERE rol BODEGUERO con carril en este camión.
        ★ v0.10.0 — Inicia la repartición DE SU CARRIL. Precondición: la
        recolección DE SU CARRIL debe estar completa (no la del otro). Si no → 409.
        El carril pasa a EN_REPARTICION. Los carriles son independientes: uno
        puede estar repartiendo mientras el otro sigue recolectando.
        Devuelve el plan de repartición de su carril (pedidos en orden de
        paradas INVERSO, con solo los ítems de su carril).
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Repartición iniciada, con el plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistributionPlan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La recolección no está completa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /picking/trucks/{truck_id}/distribution:
    get:
      tags: [distribution]
      summary: El plan de repartición y su progreso
      description: >
        REQUIERE rol BODEGUERO con carril en este camión.
        ★ v0.10.0 — El plan DE SU CARRIL: los pedidos en orden de paradas
        inverso, con solo los ítems de su carril, lo ya asignado y a qué pallets.
        Para pausar/retomar.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: El plan con progreso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistributionPlan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /picking/trucks/{truck_id}/pallets:
    get:
      tags: [distribution]
      summary: Los pallets del camión
      description: REQUIERE rol BODEGUERO asignado. Los pallets creados y su contenido.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Los pallets
          content:
            application/json:
              schema:
                type: object
                properties:
                  pallets:
                    type: array
                    items: { $ref: '#/components/schemas/Pallet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [distribution]
      summary: Crear un pallet nuevo
      description: >
        REQUIERE rol BODEGUERO con carril en este camión.
        ★ v0.10.0 — Crea un pallet DE SU CARRIL. El tipo se deriva del carril
        del bodeguero (no lo elige: el de FROZEN crea pallets FROZEN).
        El correlativo es POR TIPO: "<camión>-Regular-1, -2" y
        "<camión>-Frozen-1, -2", numerados independientemente.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                ★ v0.10.0 — Sin cuerpo requerido: el tipo se deriva del carril
                del bodeguero. Si se envía pallet_type y no coincide con su
                carril → 400.
              properties:
                pallet_type:
                  allOf:
                    - $ref: '#/components/schemas/PalletType'
                  description: Opcional; debe coincidir con el carril del bodeguero.
      responses:
        '201':
          description: Pallet creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pallet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /picking/trucks/{truck_id}/assign-to-pallet:
    post:
      tags: [distribution]
      summary: Asignar un ítem de un pedido a un pallet (repartición)
      description: >
        REQUIERE rol BODEGUERO con carril en este camión. El acto central de la
        repartición: pone una cantidad de un ítem de un pedido en un pallet.
        REGLAS que el middleware valida:
          · ★ v0.10.0 — El ítem y el pallet deben ser DEL CARRIL del bodeguero.
            Tocar el carril ajeno → 403.
          · El pallet debe ser del tipo correcto (frozen→FROZEN, regular→REGULAR)
            → 400 si no.
          · Cuadre POR CARRIL: lo repartido ≤ lo recogido en ese carril → 400.
        Idempotente por (order_uuid, item_code, pallet_id): reenviar actualiza.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_uuid, item_code, pallet_id, quantity]
              properties:
                order_uuid: { type: string, format: uuid }
                item_code: { type: string }
                pallet_id: { type: string, format: uuid }
                quantity: { type: number, format: double }
      responses:
        '200':
          description: Asignación registrada; devuelve el progreso del pedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDistributionProgress' }
        '400':
          description: Tipo de pallet incorrecto, o excede lo recogido (cuadre)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /picking/trucks/{truck_id}/complete-distribution:
    post:
      tags: [distribution]
      summary: Cerrar la repartición (EN_REPARTICION → ALISTADO)
      description: >
        REQUIERE rol BODEGUERO con carril en este camión.
        ★ v0.10.0 — Cierra SU CARRIL. Valida el cuadre DE SU CARRIL: todo lo
        recogido en él debe estar repartido (o justificado). Si falta → 409 con
        el detalle. Su carril pasa a CERRADO.
        El CAMIÓN pasa a ALISTADO solo cuando TODOS sus carriles están CERRADO.
        Si el otro carril sigue abierto, el camión NO queda ALISTADO todavía.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: >
            Carril cerrado. El camión queda ALISTADO solo si todos los carriles
            cerraron; si no, sigue en curso.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Queda producto sin repartir (no cuadra)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistributionMismatch' }

  /admin/trucks/{truck_id}/unassign:
    post:
      tags: [picking-admin]
      summary: Desasignar un carril (quitarle el bodeguero)
      description: >
        ★ v0.10.0 — REQUIERE rol ADMIN.
        Quita el bodeguero de un carril: el carril vuelve a SIN_ASIGNAR.
        ⚠️ SE PIERDE EL PROGRESO de ese carril (recolección, repartición y
        pallets del carril se descartan). El Dashboard debe AVISARLO antes de
        confirmar. Si solo se quiere cambiar de persona conservando el trabajo,
        usar `assign` (reasignar), no este endpoint.
        Disponible SIEMPRE mientras el camión no esté ALISTADO (aunque el carril
        esté EN_PICKING o EN_REPARTICION) → 409 si el camión ya está ALISTADO.
        ★ Si tras desasignar NINGÚN carril queda asignado, el camión vuelve a
        CONFIRMADO (y desde ahí se puede cancelar o eliminar). Esto cierra el
        ciclo: toda asignación es reversible.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lane]
              properties:
                lane:
                  $ref: '#/components/schemas/PickingLane'
      responses:
        '200':
          description: Carril desasignado; devuelve el camión actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDetail' }
        '400':
          description: El carril no existe en este camión, o ya está SIN_ASIGNAR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión está ALISTADO (ya se picó)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/trucks/{truck_id}/manifest:
    get:
      tags: [manifest]
      summary: Manifiesto de Ruta del camión (informe final)
      description: >
        REQUIERE rol ADMIN.
        El informe con el que el driver entrega: los pedidos por parada, en
        orden de entrega DIRECTO (parada 1, 2, 3...), con el/los pallet(s) de
        cada pedido. Solo para camiones ALISTADOS (si no → 409).
        Puramente lectura: junta datos que ya existen.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: El manifiesto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteManifest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión no está ALISTADO
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/trucks/{truck_id}/delivery:
    get:
      tags: [delivery]
      summary: Estado de entrega de los pedidos de un camión
      description: >
        ★ v0.11.0 — REQUIERE rol ADMIN.
        La pantalla de cierre: todos los pedidos del camión, por parada (orden
        DIRECTO, como el manifiesto), con su estado de entrega.
        Solo para camiones ALISTADOS → 409 si no.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: El estado de entrega del camión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDelivery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión no está ALISTADO (no ha salido)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/orders/{order_uuid}/delivery:
    post:
      tags: [delivery]
      summary: Registrar el resultado de la entrega de un pedido
      description: >
        ★ v0.11.0 — REQUIERE rol ADMIN.
        Cierra la entrega de UN pedido. Reglas que valida el middleware:
          · El pedido debe pertenecer a un camión ALISTADO → 409 si no.
          · ENTREGADO: sin order_reason ni rejected_items.
          · NO_ENTREGADO: order_reason OBLIGATORIO, sin rejected_items.
          · ENTREGADO_PARCIAL: rejected_items OBLIGATORIO (al menos uno), sin
            order_reason. Cada ítem rechazado debe pertenecer al pedido y su
            cantidad no puede exceder lo que el pedido llevaba → 400.
        Idempotente: volver a registrar el mismo pedido ACTUALIZA el registro
        (el admin puede corregirse).
      parameters:
        - name: order_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/DeliveryStatus' }
                order_reason:
                  allOf:
                    - $ref: '#/components/schemas/OrderRejectionReason'
                  nullable: true
                rejected_items:
                  type: array
                  items:
                    type: object
                    required: [item_code, quantity, reason]
                    properties:
                      item_code: { type: string }
                      quantity: { type: number, format: double }
                      reason: { $ref: '#/components/schemas/ItemRejectionReason' }
                note: { type: string, nullable: true }
      responses:
        '200':
          description: Entrega registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryRecord' }
        '400':
          description: >
            Combinación inválida (falta motivo, sobran ítems para el estado,
            ítem que no es del pedido, cantidad que excede lo llevado).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El pedido no está en un camión ALISTADO
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/workload:
    get:
      tags: [workload]
      summary: Tablero de carga — qué despachar cada día
      description: >
        ★ v0.12.0 — REQUIERE rol ADMIN.
        El tablero de planificación del admin de bodega. Puramente lectura.

        Toma todos los pedidos APROBADOS sin entregar y los reparte en columnas
        de LUNES a VIERNES (+ SIN_DIA), agrupados por shipping code.

        Reglas de asignación de día:
          · Cada pedido cae en UN SOLO día: el PRÓXIMO día de entrega de su
            shipping code contado DESDE HOY. Un shipping code con varios días
            NO reparte sus pedidos entre ellos.
          · Sábado y domingo se IGNORAN.
          · Sin shipping code, sin días configurados, o solo fin de semana
            → columna SIN_DIA.
          · Un pedido que ya existía cuando pasó su día y no se despachó se
            marca ATRASADO (aparece en el próximo día disponible).
      responses:
        '200':
          description: El tablero
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkloadBoard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/picking-board:
    get:
      tags: [picking-admin]
      summary: Picking en curso — el piso de la bodega de un vistazo
      description: >
        ★ v0.13.0 — REQUIERE rol ADMIN. Puramente lectura.

        Todos los camiones que se están trabajando (ASIGNADO, EN_PICKING,
        EN_REPARTICION) más los ALISTADOS de HOY, con el avance de cada carril
        y sus faltantes.

        Resuelve la ceguera del admin entre "asigné" y "apareció ALISTADO":
        ahora ve quién está trabajando qué, cuánto lleva, y dónde hay faltantes.

        Los endpoints /picking/* son del bodeguero (filtrados por su token);
        este es su equivalente de solo lectura para el admin.

        El Dashboard lo refresca solo cada ~30s.
      responses:
        '200':
          description: El tablero de picking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickingBoard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/drivers:
    get:
      tags: [dispatch-admin]
      summary: Lista de drivers (para asignar camiones)
      description: >
        ★ v0.14.0 — REQUIERE ADMIN. Los usuarios con rol DRIVER, para que el
        admin elija a quién asignar un camión. Indica si cada uno ya tiene un
        camión activo (un driver, un camión a la vez).
      responses:
        '200':
          description: Lista de drivers
          content:
            application/json:
              schema:
                type: object
                properties:
                  drivers:
                    type: array
                    items:
                      type: object
                      properties:
                        username: { type: string }
                        display_name: { type: string }
                        current_truck_id:
                          type: string
                          format: uuid
                          nullable: true
                          description: >
                            El camión que ya tiene asignado (ASIGNADO_DRIVER o
                            EN_RUTA). NULL si está libre.
                        current_truck_name: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/trucks/{truck_id}/assign-driver:
    post:
      tags: [dispatch-admin]
      summary: Asignar (o reasignar) un camión a un driver
      description: >
        ★ v0.14.0 — REQUIERE ADMIN.
        El camión debe estar ALISTADO (ya picado) → 409 si no.
        UN DRIVER, UN CAMIÓN A LA VEZ: si el driver ya tiene otro camión
        ASIGNADO_DRIVER o EN_RUTA → 400.
        ALISTADO → ASIGNADO_DRIVER. Reasignable mientras no esté EN_RUTA.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driver_username]
              properties:
                driver_username: { type: string }
      responses:
        '200':
          description: Camión asignado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDetail' }
        '400':
          description: El driver no existe, o ya tiene otro camión activo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión no está ALISTADO, o ya salió (EN_RUTA)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/trucks/{truck_id}/unassign-driver:
    post:
      tags: [dispatch-admin]
      summary: Quitarle el camión a un driver
      description: >
        ★ v0.14.0 — REQUIERE ADMIN. El camión vuelve a ALISTADO.
        No se puede si ya está EN_RUTA o RUTA_CERRADA → 409.
        (Cierra el ciclo: la asignación de driver es reversible antes de salir.)
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Driver desasignado; el camión vuelve a ALISTADO
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión ya salió (EN_RUTA/RUTA_CERRADA)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /dispatch/my-route:
    get:
      tags: [dispatch]
      summary: La ruta completa del driver (descarga para trabajar offline)
      description: >
        ★ v0.14.0 — REQUIERE rol DRIVER.
        Devuelve TODO lo que el driver necesita para trabajar la ruta SIN
        CONEXIÓN: paradas en orden, pedidos de cada parada, líneas de cada
        pedido, cliente y dirección. Es la descarga que debe hacer antes de salir.
        Sin camión asignado → 404 (la app avisa "no tienes ruta asignada").
        ★ La app debe AVISAR CLARAMENTE si el driver no ha descargado su ruta.
      responses:
        '200':
          description: La ruta completa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverRoute' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El driver no tiene camión asignado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /dispatch/start-route:
    post:
      tags: [dispatch]
      summary: Iniciar la ruta (ASIGNADO_DRIVER → EN_RUTA)
      description: >
        ★ v0.14.0 — REQUIERE rol DRIVER con camión asignado.
        Marca que salió a despachar. Idempotente: si ya está EN_RUTA, devuelve
        el estado actual.
      responses:
        '200':
          description: Ruta iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverRoute' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión no está ASIGNADO_DRIVER
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /dispatch/orders/{order_uuid}/deliver:
    post:
      tags: [dispatch]
      summary: Registrar la entrega de un pedido (desde la calle)
      description: >
        ★ v0.14.0 — REQUIERE rol DRIVER; el pedido debe ser de SU camión → 403.

        ★ EL ESTADO SE DERIVA de lo que marca el driver — él NO lo elige:
          · sin rejected_items y sin order_reason → ENTREGADO
          · con rejected_items                    → ENTREGADO_PARCIAL
          · con order_reason (salida rápida)      → NO_ENTREGADO

        Los motivos son los mismos del Bloque 3A (ItemRejectionReason y
        OrderRejectionReason). Lo NO entregado alimenta la lista de RETORNADOS.

        Idempotente por pedido: reenviar ACTUALIZA (clave para el offline —
        la cola puede reintentar sin duplicar).
      parameters:
        - name: order_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                O bien `order_reason` (no se entregó nada), o bien
                `rejected_items` (entregó con novedades), o ninguno de los dos
                (entregó todo). Mandar ambos → 400.
              properties:
                order_reason:
                  allOf:
                    - $ref: '#/components/schemas/OrderRejectionReason'
                  nullable: true
                  description: Salida rápida — no se entregó nada.
                rejected_items:
                  type: array
                  description: Ítems que el cliente NO recibió, con su motivo.
                  items:
                    type: object
                    required: [item_code, quantity, reason]
                    properties:
                      item_code: { type: string }
                      quantity:
                        type: number
                        format: double
                        description: Cuántas unidades NO se entregaron.
                      reason: { $ref: '#/components/schemas/ItemRejectionReason' }
                note: { type: string, nullable: true }
                occurred_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: >
                    ★ Cuándo ocurrió la entrega EN LA CALLE. Importante para el
                    offline: si se registró sin señal y se sincroniza horas
                    después, esta es la hora real, no la de llegada al servidor.
      responses:
        '200':
          description: Entrega registrada; devuelve el estado derivado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryRecord' }
        '400':
          description: >
            order_reason y rejected_items juntos; ítem que no es del pedido;
            cantidad mayor a la que llevaba.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: El pedido no es del camión de este driver
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión no está EN_RUTA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /dispatch/finish-route:
    post:
      tags: [dispatch]
      summary: Terminar la ruta (EN_RUTA → RUTA_CERRADA)
      description: >
        ★ v0.14.0 — REQUIERE rol DRIVER con camión EN_RUTA.
        Cierra la jornada del driver. Los pedidos sin registrar quedan como
        estaban (PENDIENTE) — NO se fuerza un estado: el admin los cierra desde
        el Dashboard si hace falta.
        Devuelve el resumen de la ruta, incluida la lista de RETORNADOS.
      responses:
        '200':
          description: Ruta cerrada, con el resumen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión no está EN_RUTA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /dispatch/returns:
    post:
      tags: [returns]
      summary: Registrar un retorno de producto (con foto)
      description: >
        ★ v0.15.0 — REQUIERE rol DRIVER con camión EN_RUTA.

        El cliente devuelve mercancía de FACTURAS ANTERIORES. El driver la
        recibe, la documenta con una foto, y queda registrada para el admin.
        NO afecta inventario — es un registro (nada se escribe a SAP).

        Reglas:
          · El `client_code` debe ser de una parada de SU ruta → 400 si no.
          · Al menos un ítem, cada uno con cantidad > 0 y motivo.
          · La FOTO es OBLIGATORIA (base64, ya redimensionada por la app).
          · `occurred_at` = la hora real de la visita (clave para el offline).

        La app manda todo en UNA petición: o entra el retorno completo con su
        evidencia, o no entra.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [return_uuid, client_code, items, photo_base64]
              properties:
                return_uuid:
                  type: string
                  format: uuid
                  description: >
                    ★ v0.15.0 — Identidad del retorno, GENERADA POR LA APP.
                    Hace el POST idempotente: si el servidor ya procesó este
                    return_uuid, devuelve 200 con el registro existente en vez
                    de crear un duplicado.
                    Es necesario porque un retorno NO tiene identidad natural
                    (a diferencia de `deliver`, cuya clave es el order_uuid):
                    el mismo cliente puede devolver lo mismo dos veces el mismo
                    día legítimamente. Sin esta clave, un reintento tras
                    perderse la respuesta crearía un retorno duplicado con su
                    foto.
                client_code:
                  type: string
                  description: El cliente que devuelve. Debe ser una parada de su ruta.
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [item_code, quantity, reason]
                    properties:
                      item_code: { type: string }
                      quantity: { type: number, format: double }
                      reason: { $ref: '#/components/schemas/ProductReturnReason' }
                photo_base64:
                  type: string
                  description: >
                    La foto en base64, SIN el prefijo data-uri. La app la
                    redimensiona antes (~1024px, calidad ~70%) para que pese
                    150-300KB. OBLIGATORIA.
                note: { type: string, nullable: true }
                occurred_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: >
                    Cuándo ocurrió la visita. Si se registró sin señal y
                    sincroniza después, esta es la hora real.
                client_reference:
                  type: string
                  nullable: true
                  description: >
                    Referencia opcional que dé el cliente (número de factura,
                    remisión). Texto libre — no se valida contra nada.
      responses:
        '201':
          description: Retorno registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductReturn' }
        '200':
          description: >
            ★ Este return_uuid YA fue procesado — devuelve el registro existente
            sin crear un duplicado. Es la respuesta al reintento de una app que
            no recibió la confirmación.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductReturn' }
        '400':
          description: >
            Cliente que no es de su ruta; sin ítems; cantidad inválida; ítem
            que no existe; foto ausente o ilegible.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: El camión no está EN_RUTA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /dispatch/returns/mine:
    get:
      tags: [returns]
      summary: Los retornos que registró el driver en esta ruta
      description: >
        ★ v0.15.0 — REQUIERE rol DRIVER. Para que el driver revise lo que lleva
        registrado. No incluye la foto (solo si la tiene).
      responses:
        '200':
          description: Los retornos de su ruta actual
          content:
            application/json:
              schema:
                type: object
                properties:
                  returns:
                    type: array
                    items: { $ref: '#/components/schemas/ProductReturn' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/returns:
    get:
      tags: [returns-admin]
      summary: Retornos de producto registrados
      description: >
        ★ v0.15.0 — REQUIERE ADMIN. Lo que los drivers han recibido de vuelta.
        El admin lo procesa manualmente (no hay movimiento de inventario
        automático).
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
          description: Desde esta fecha (inclusive). Por defecto, hoy.
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
          description: Hasta esta fecha (inclusive). Por defecto, hoy.
      responses:
        '200':
          description: Los retornos del período
          content:
            application/json:
              schema:
                type: object
                properties:
                  returns:
                    type: array
                    items: { $ref: '#/components/schemas/ProductReturn' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/returns/{return_id}/photo:
    get:
      tags: [returns-admin]
      summary: La foto de un retorno
      description: >
        ★ v0.15.0 — REQUIERE ADMIN. Devuelve la imagen para verla en el
        Dashboard. El middleware la sirve desde disco.
      parameters:
        - name: return_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: La imagen
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /dispatch/payments:
    post:
      tags: [payments]
      summary: Registrar un pago recibido en ruta
      description: >
        ★ v0.16.0 — REQUIERE rol DRIVER con camión EN_RUTA.

        El driver recibe dinero del cliente durante la visita. Es un REGISTRO —
        el admin lo aplica después en SAP; nada se escribe a SAP desde aquí.

        Reglas:
          · `payment_uuid` lo GENERA LA APP → idempotente. Si ya fue procesado,
            devuelve 200 con el registro existente. Un pago duplicado es tan
            grave como uno perdido.
          · El `client_code` debe ser de una parada de SU ruta → 400 si no.
          · `amount` > 0.
          · CHEQUE: `check_number` y `photo_base64` OBLIGATORIOS.
          · CASH: sin foto ni número de cheque (mandarlos → 400).
          · `occurred_at` = la hora real de la visita.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_uuid, client_code, amount, payment_type]
              properties:
                payment_uuid:
                  type: string
                  format: uuid
                  description: >
                    ★ Identidad del pago, GENERADA POR LA APP. Hace el POST
                    idempotente: un reintento tras perderse la respuesta
                    devuelve el registro existente en vez de duplicar el dinero.
                client_code:
                  type: string
                  description: El cliente que paga. Debe ser una parada de su ruta.
                amount:
                  type: number
                  format: double
                  description: El monto recibido. Debe ser > 0.
                payment_type: { $ref: '#/components/schemas/PaymentType' }
                check_number:
                  type: string
                  nullable: true
                  description: OBLIGATORIO si payment_type es CHEQUE; ausente si CASH.
                photo_base64:
                  type: string
                  nullable: true
                  description: >
                    La foto del cheque, en base64 sin prefijo data-uri, ya
                    redimensionada por la app (~1024px, ~70%).
                    OBLIGATORIA si CHEQUE; ausente si CASH.
                note: { type: string, nullable: true }
                occurred_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Cuándo se recibió el dinero (hora real, no la de sync).
      responses:
        '201':
          description: Pago registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '200':
          description: >
            Este payment_uuid YA fue procesado — devuelve el registro existente
            sin duplicar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '400':
          description: >
            Cliente que no es de su ruta; monto <= 0; CHEQUE sin número o sin
            foto; CASH con número de cheque o foto; foto ilegible.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: El camión no está EN_RUTA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /dispatch/payments/mine:
    get:
      tags: [payments]
      summary: Los pagos que recogió el driver, con el total de su caja
      description: >
        ★ v0.16.0 — REQUIERE rol DRIVER.
        Lo que lleva recogido en su ruta actual, con el total separado por CASH
        y CHEQUE — al terminar trae ese dinero encima y necesita saber cuánto es.
        Los ANULADOS aparecen marcados pero NO suman al total.
        Sigue accesible con la ruta cerrada (para poder anular después).
      responses:
        '200':
          description: Sus pagos y el total
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverPaymentSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /dispatch/payments/{payment_uuid}/void:
    post:
      tags: [payments]
      summary: Anular un pago mal registrado
      description: >
        ★ v0.16.0 — REQUIERE rol DRIVER; el pago debe ser SUYO → 403.

        ★ EL REGISTRO NO SE BORRA. Queda como anulado, con quién lo anuló,
        cuándo y POR QUÉ. Un pago es dinero: nada desaparece, todo queda
        auditable.

        El MOTIVO es obligatorio — un pago anulado sin explicación es una
        bandera roja que nadie puede resolver después.

        Se puede anular EN CUALQUIER MOMENTO, incluso con la ruta ya cerrada:
        el error suele notarse al cuadrar la caja en la bodega.

        Anular dos veces el mismo pago → 200 (idempotente), sin cambiar el
        motivo ni la hora del primer anulado.
      parameters:
        - name: payment_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  description: Por qué se anula. OBLIGATORIO.
                occurred_at:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        '200':
          description: Pago anulado (o ya lo estaba)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '400':
          description: Sin motivo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: El pago no es de este driver
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/payments:
    get:
      tags: [payments-admin]
      summary: Pagos recibidos en ruta
      description: >
        ★ v0.16.0 — REQUIERE ADMIN. El dinero que los drivers recogieron.
        El admin lo aplica en SAP manualmente.
        Incluye los ANULADOS (marcados, con su motivo) — el rastro importa.
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
          description: Desde esta fecha (inclusive). Por defecto, hoy.
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
          description: Hasta esta fecha (inclusive). Por defecto, hoy.
      responses:
        '200':
          description: Los pagos del período, con totales
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPaymentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/payments/{payment_uuid}/photo:
    get:
      tags: [payments-admin]
      summary: La foto del cheque
      description: >
        ★ v0.16.0 — REQUIERE ADMIN. Solo para pagos con CHEQUE.
        404 si es CASH (no tiene foto).
      parameters:
        - name: payment_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: La imagen
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Since:
      name: since
      in: query
      required: false
      schema: { type: string, format: date-time }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }

  responses:
    Unauthorized:
      description: Token ausente o inválido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Token válido pero el rol no tiene permiso
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Petición inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Role:
      type: string
      enum: [VENDEDOR, ADMIN, BODEGUERO, DRIVER]

    OrderStatus:
      type: string
      enum: [SINCRONIZADA, RETENIDA_CARTERA, APROBADA, RECHAZADA]
      description: >
        ★ v0.4.0 — Máquina de estados inaugurada.

          SINCRONIZADA      Estado transitorio al recibirla. El middleware
                            evalúa la cartera y la mueve de inmediato.
          RETENIDA_CARTERA  Excede cupo o tiene mora. Espera decisión del admin.
          APROBADA          Cartera OK, o el admin la liberó. Sigue su curso.
          RECHAZADA         El admin la rechazó. No procede.

        Transiciones válidas:
          SINCRONIZADA     → APROBADA | RETENIDA_CARTERA   (automático)
          RETENIDA_CARTERA → APROBADA | RECHAZADA          (acción del admin)
          APROBADA         → (final por ahora)
          RECHAZADA        → (final)

        (Estados futuros del diseño — NO implementar aún: EN_RUTA, EN_PICKING,
         ALISTADA, FACTURADA, ENTREGADA, RETENIDA_DESCUENTO...)

    WeekDay:
      type: string
      enum: [LUNES, MARTES, MIERCOLES, JUEVES, VIERNES, SABADO, DOMINGO]

    ShippingCodeConfig:
      type: object
      description: >
        Un shipping code (zona logística de SAP) con los días de entrega que el
        admin le configuró. El código y el nombre vienen de SAP
        ([@RSAP_SHIPPING_CODE]); los días son del middleware.
      properties:
        code:
          type: integer
          description: Código (U_RSAP_SHIPPING_CODE).
        name:
          type: string
          description: Nombre legible (BNX3, BRK1, QNS2...).
        delivery_days:
          type: array
          items: { $ref: '#/components/schemas/WeekDay' }
          description: Días de entrega configurados (puede ser vacío).
        client_count:
          type: integer
          description: Cuántos clientes tienen este shipping code.

    RouteExportStop:
      type: object
      description: >
        Una parada para exportar a OptimoRoute. Agrupa TODOS los pedidos de un
        cliente en el camión (una parada por cliente).
      properties:
        client_code:
          type: string
          description: Va en la columna "Order #" del CSV (OptimoRoute alfanumérico).
        customer_name: { type: string }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        zip_code: { type: string, nullable: true }
        sales_rep: { type: string, nullable: true }
        subtotal:
          type: number
          format: double
          description: Suma de los pedidos de este cliente en el camión.
        shipping_code_name: { type: string, nullable: true }
        order_count:
          type: integer
          description: Cuántos pedidos de este cliente hay en el camión.
        address_incomplete:
          type: boolean
          description: >
            TRUE si falta dirección, ciudad o zip. Aviso para el admin:
            OptimoRoute podría no ubicar esta parada. NO bloquea la exportación.

    RouteStop:
      type: object
      description: Una parada ya ordenada (tras importar de OptimoRoute).
      properties:
        client_code: { type: string }
        customer_name: { type: string }
        stop_number:
          type: integer
          description: Orden de entrega (1 = primera parada).
        order_count:
          type: integer
          description: Pedidos de este cliente en el camión (todos comparten el stop).

    TruckRoute:
      type: object
      description: El orden de paradas de un camión.
      properties:
        truck_id: { type: string, format: uuid }
        has_route:
          type: boolean
          description: Si el camión ya tiene orden de paradas importado.
        imported_at:
          type: string
          format: date-time
          nullable: true
        stops:
          type: array
          items: { $ref: '#/components/schemas/RouteStop' }
          description: Las paradas ordenadas por stop_number.

    PickingTruckSummary:
      type: object
      description: Resumen de un camión asignado, para la app de bodega.
      properties:
        truck_id: { type: string, format: uuid }
        name: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TruckStatus' }
        my_lane:
          $ref: '#/components/schemas/PickingLane'
        my_lane_status:
          $ref: '#/components/schemas/LaneStatus'
        order_count: { type: integer }
        stop_count:
          type: integer
          description: Cuántas paradas (clientes) tiene el camión.
        regular_item_count:
          type: integer
          description: Cuántos ítems distintos regulares hay que recoger.
        frozen_item_count:
          type: integer
          description: Cuántos ítems distintos congelados hay que recoger.
        collection_progress:
          type: number
          format: double
          description: >
            ★ v0.10.0 — Fracción recogida DE SU CARRIL (0..1). No del camión
            completo.

    PickingCollection:
      type: object
      description: >
        Las dos listas de recolección consolidada de un camión, con progreso.
        Refleja el estado para pausar/retomar.
      properties:
        truck_id: { type: string, format: uuid }
        truck_name: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TruckStatus' }
        my_lane:
          $ref: '#/components/schemas/PickingLane'
        items:
          type: array
          description: >
            ★ v0.10.0 — Los ítems DE SU CARRIL. Si my_lane es REGULAR, los que
            no empiezan con F; si es FROZEN, los que sí.
          items: { $ref: '#/components/schemas/PickingItem' }
        other_lane_summary:
          type: object
          nullable: true
          description: >
            ★ v0.10.0 — Contexto del OTRO carril (solo lectura). NULL si el
            camión no tiene el otro carril.
          properties:
            lane: { $ref: '#/components/schemas/PickingLane' }
            assigned_to_name: { type: string, nullable: true }
            status: { $ref: '#/components/schemas/LaneStatus' }
            collection_progress: { type: number, format: double }

    PickingItem:
      type: object
      description: Un ítem a recoger, consolidado de todo el camión.
      properties:
        item_code: { type: string }
        item_name: { type: string }
        is_frozen:
          type: boolean
          description: TRUE si ItemCode empieza con F.
        required_quantity:
          type: number
          format: double
          description: Total a recoger (suma de todos los pedidos del camión).
        collected_quantity:
          type: number
          format: double
          description: Cuánto lleva recogido (suma de sus registros de bin).
        shortage_quantity:
          type: number
          format: double
          description: Cuánto se marcó como faltante.
        is_complete:
          type: boolean
          description: Si collected + shortage cubre lo requerido.
        bins:
          type: array
          description: >
            Bins con stock de este ítem (FOTO del inicio). El bodeguero elige
            de cuál toma. is_system_bin marca el stock sin ubicar.
          items:
            type: object
            properties:
              bin_code: { type: string }
              on_hand: { type: number, format: double }
              is_system_bin: { type: boolean }
        collected_from:
          type: array
          description: De qué bins ya recogió y cuánto (para pausar/retomar).
          items:
            type: object
            properties:
              bin_code: { type: string }
              quantity: { type: number, format: double }

    PickingItemProgress:
      type: object
      description: El progreso de un ítem tras registrar recolección o faltante.
      properties:
        item_code: { type: string }
        required_quantity: { type: number, format: double }
        collected_quantity: { type: number, format: double }
        shortage_quantity: { type: number, format: double }
        is_complete: { type: boolean }

    PickingLane:
      type: string
      enum: [REGULAR, FROZEN]
      description: >
        ★ v0.10.0 — El carril de picking. REGULAR = ítems que NO empiezan con F
        (almacén). FROZEN = ítems que empiezan con F (nevera). Cada carril lo
        trabaja un bodeguero distinto, en paralelo.

    LaneProgress:
      type: object
      description: >
        ★ v0.10.0 — El avance de UN carril del camión. Los carriles son
        independientes y pueden ir desfasados.
      properties:
        lane: { $ref: '#/components/schemas/PickingLane' }
        assigned_to:
          type: string
          nullable: true
          description: Username del bodeguero de este carril. NULL = sin asignar.
        assigned_to_name: { type: string, nullable: true }
        status:
          $ref: '#/components/schemas/LaneStatus'
        collection_progress:
          type: number
          format: double
          description: Fracción recogida de este carril (0..1).
        distribution_complete:
          type: boolean
          description: Si la repartición de este carril ya cerró.
        item_count:
          type: integer
          description: Cuántos ítems distintos tiene este carril.

    LaneStatus:
      type: string
      enum: [SIN_ASIGNAR, ASIGNADO, EN_PICKING, EN_REPARTICION, CERRADO]
      description: >
        ★ v0.10.0 — El estado de UN carril (no del camión).
          SIN_ASIGNAR     No tiene bodeguero todavía.
          ASIGNADO        Tiene bodeguero, no ha empezado.
          EN_PICKING      Recolectando.
          EN_REPARTICION  Recolección completa, repartiendo en pallets.
          CERRADO         Repartición cerrada. El camión queda ALISTADO cuando
                          TODOS sus carriles están CERRADO.

    PalletType:
      type: string
      enum: [FROZEN, REGULAR]
      description: FROZEN y REGULAR nunca se mezclan en un pallet.

    Pallet:
      type: object
      properties:
        pallet_id: { type: string, format: uuid }
        label:
          type: string
          description: >
            ★ v0.10.0 — Nombre del camión + tipo + correlativo POR TIPO
            (ej. "Queens-Regular-1", "Queens-Frozen-1").
        pallet_type: { $ref: '#/components/schemas/PalletType' }
        sequence:
          type: integer
          description: >
            ★ v0.10.0 — Correlativo dentro del camión POR TIPO. Regular y Frozen
            numeran independientemente (Regular-1, Regular-2 / Frozen-1).
        assignments:
          type: array
          description: Qué hay en el pallet (ítem, cantidad, de qué pedido).
          items:
            type: object
            properties:
              order_uuid: { type: string, format: uuid }
              client_name: { type: string }
              item_code: { type: string }
              item_name: { type: string }
              quantity: { type: number, format: double }

    DistributionPlan:
      type: object
      description: >
        El plan de repartición: los pedidos en orden de paradas INVERSO (el
        último en entregarse primero, para cargar al fondo). Con progreso.
      properties:
        truck_id: { type: string, format: uuid }
        truck_name: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TruckStatus' }
        orders:
          type: array
          description: Pedidos en orden de reparto (paradas inverso).
          items: { $ref: '#/components/schemas/OrderDistributionProgress' }

    OrderDistributionProgress:
      type: object
      description: El estado de repartición de un pedido.
      properties:
        order_uuid: { type: string, format: uuid }
        order_number: { type: string }
        client_code: { type: string }
        client_name: { type: string }
        stop_number:
          type: integer
          nullable: true
          description: Su parada (del orden de OptimoRoute).
        is_complete:
          type: boolean
          description: >
            Si el pedido ya está repartido: todo lo DISPONIBLE de sus ítems está
            en pallets. ★ v0.10.0 — Un pedido con faltantes puede estar
            "completo" para la repartición (se repartió todo lo que había) y aun
            así ser una entrega incompleta — ver is_incomplete_delivery.
        is_incomplete_delivery:
          type: boolean
          description: >
            ★ v0.10.0 — TRUE si el cliente NO va a recibir todo lo que pidió
            (hubo faltante en algún ítem). El pedido se entrega igual, con menos.
            Informativo para el manifiesto y para avisar al vendedor (Bloque 3).
        items:
          type: array
          items:
            type: object
            properties:
              item_code: { type: string }
              item_name: { type: string }
              is_frozen: { type: boolean }
              ordered_quantity:
                type: number
                format: double
                description: Cuánto pidió este pedido de este ítem.
              available_quantity:
                type: number
                format: double
                description: >
                  ★ v0.10.0 — Cuánto hay REALMENTE disponible para repartir a
                  este pedido (limitado por lo recogido en el camión, no por lo
                  pedido). Si hubo faltante, es MENOR que ordered_quantity.
                  Si es 0, el ítem NO se ofrece para repartir.
              has_shortage:
                type: boolean
                description: >
                  ★ v0.10.0 — TRUE si no se recogió todo lo que este pedido
                  pidió de este ítem. El pedido quedará incompleto.
              distributed_quantity:
                type: number
                format: double
                description: Cuánto ya se puso en pallets.
              remaining:
                type: number
                format: double
                description: Cuánto falta por repartir a este pedido.
              in_pallets:
                type: array
                description: En qué pallets ya está y cuánto.
                items:
                  type: object
                  properties:
                    pallet_id: { type: string, format: uuid }
                    pallet_label: { type: string }
                    quantity: { type: number, format: double }

    DistributionMismatch:
      type: object
      description: Producto sin repartir al intentar cerrar (no cuadra).
      properties:
        message: { type: string }
        unresolved:
          type: array
          items:
            type: object
            properties:
              item_code: { type: string }
              item_name: { type: string }
              collected: { type: number, format: double }
              distributed: { type: number, format: double }
              difference: { type: number, format: double }

    RouteManifest:
      type: object
      description: >
        El informe de entrega. Pedidos por parada en orden DIRECTO, con sus pallets.
      properties:
        truck_id: { type: string, format: uuid }
        truck_name: { type: string, nullable: true }
        assigned_to_name: { type: string, nullable: true }
        generated_at: { type: string, format: date-time }
        total_stops: { type: integer }
        total_orders: { type: integer }
        total_pallets: { type: integer }
        total_units:
          type: number
          format: double
          description: Suma de unidades de todo el camión (todas las "cajas").
        stops:
          type: array
          description: Las paradas en orden de entrega DIRECTO (1, 2, 3...).
          items:
            type: object
            properties:
              stop_number: { type: integer }
              client_code: { type: string }
              client_name: { type: string }
              address: { type: string, nullable: true }
              city: { type: string, nullable: true }
              orders:
                type: array
                items:
                  type: object
                  properties:
                    order_uuid: { type: string, format: uuid }
                    order_number: { type: string }
                    total_amount: { type: number, format: double }
                    total_units:
                      type: number
                      format: double
                      description: >
                        ★ v0.9.0 — Suma de las unidades del pedido (las "cajas"
                        del manifiesto). De las líneas del pedido.
                    pallet_labels:
                      type: array
                      items: { type: string }
                      description: >
                        Los pallets de este pedido (ej. ["Queens-Regular-1",
                        "Queens-Frozen-1"]). Un pedido con congelados tiene 2.
                    is_incomplete_delivery:
                      type: boolean
                      description: >
                        ★ v0.10.0 — TRUE si al pedido le faltó producto (no se
                        recogió todo lo pedido). El cliente recibe menos de lo
                        que pidió. El manifiesto debe MARCARLO para que el
                        driver y el cliente lo sepan al entregar.

    DeliveryStatus:
      type: string
      enum: [PENDIENTE, ENTREGADO, ENTREGADO_PARCIAL, NO_ENTREGADO]
      description: >
        ★ v0.11.0 — El resultado de la entrega de un pedido.
          PENDIENTE          Aún no se registró (el camión salió, no ha vuelto).
          ENTREGADO          El cliente recibió todo.
          ENTREGADO_PARCIAL  Recibió, pero rechazó ítems (ver rejected_items).
          NO_ENTREGADO       No recibió nada (ver order_reason).

    OrderRejectionReason:
      type: string
      enum: [NEGOCIO_CERRADO, PEDIDO_CANCELADO]
      description: >
        ★ v0.11.0 — Por qué NO se entregó el pedido completo.
        Solo aplica a NO_ENTREGADO.

    ItemRejectionReason:
      type: string
      enum: [NO_LO_QUIERE, DANADO, SHORT, NO_ORDENADO]
      description: >
        ★ v0.11.0 — Por qué el cliente rechazó un ítem al recibir.
          NO_LO_QUIERE  El cliente no lo quiso.
          DANADO        Llegó en mal estado.
          SHORT         Llegó menos de lo facturado (falta mercancía).
          NO_ORDENADO   El cliente dice que no lo pidió.

    DeliveryRecord:
      type: object
      description: >
        ★ v0.11.0 — El resultado de la entrega de un pedido, como lo cierra el
        admin (o, en el futuro, el driver desde su app).
      properties:
        order_uuid: { type: string, format: uuid }
        order_number: { type: string }
        client_code: { type: string }
        client_name: { type: string }
        status: { $ref: '#/components/schemas/DeliveryStatus' }
        order_reason:
          allOf:
            - $ref: '#/components/schemas/OrderRejectionReason'
          nullable: true
          description: Solo si status es NO_ENTREGADO.
        rejected_items:
          type: array
          description: >
            Ítems que el cliente rechazó al recibir. Solo si status es
            ENTREGADO_PARCIAL. Esta mercancía vuelve en el camión (ROUTE RETURN,
            fase futura de BIN LOAD).
          items: { $ref: '#/components/schemas/RejectedItem' }
        recorded_at:
          type: string
          format: date-time
          nullable: true
          description: Cuándo se registró la entrega. NULL si aún PENDIENTE.
        recorded_by:
          type: string
          nullable: true
          description: Quién la registró (username del admin).
        note:
          type: string
          nullable: true
          description: Nota libre opcional del admin.

    RejectedItem:
      type: object
      properties:
        item_code: { type: string }
        item_name: { type: string }
        quantity:
          type: number
          format: double
          description: Cuántas unidades rechazó el cliente.
        reason: { $ref: '#/components/schemas/ItemRejectionReason' }

    TruckDelivery:
      type: object
      description: >
        ★ v0.11.0 — El estado de entrega de TODOS los pedidos de un camión.
        Es la pantalla de cierre del admin cuando el driver regresa.
      properties:
        truck_id: { type: string, format: uuid }
        truck_name: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TruckStatus' }
        total_orders: { type: integer }
        pending_count:
          type: integer
          description: Cuántos pedidos siguen sin registrar.
        all_recorded:
          type: boolean
          description: TRUE si ya se registraron todos.
        driver_name:
          type: string
          nullable: true
          description: ★ v0.14.0 — El driver que está despachando, si lo hay.
        route_started_at:
          type: string
          format: date-time
          nullable: true
          description: ★ v0.14.0 — Cuándo salió a ruta.
        returned_items:
          type: array
          description: >
            ★ v0.14.0 — Los RETORNADOS acumulados HASTA AHORA (lo que ya se sabe
            que vuelve en el camión), para que el admin los vea llegar en vivo
            sin esperar al cierre de la ruta. Mismo consolidado que RouteSummary.
          items: { $ref: '#/components/schemas/ReturnedItem' }
        not_delivered_orders:
          type: array
          description: >
            ★ v0.14.0 — Los pedidos NO_ENTREGADOS. Su mercancía también vuelve
            COMPLETA en el camión, pero NO aparece en returned_items (un pedido
            no entregado no tiene motivos por ítem). El admin necesita ver ambas
            cosas para saber todo lo que regresa.
          items:
            type: object
            properties:
              order_number: { type: string }
              client_name: { type: string }
              reason: { $ref: '#/components/schemas/OrderRejectionReason' }
        stops:
          type: array
          description: Las paradas en orden de entrega DIRECTO (como el manifiesto).
          items:
            type: object
            properties:
              stop_number: { type: integer }
              client_code: { type: string }
              client_name: { type: string }
              orders:
                type: array
                items: { $ref: '#/components/schemas/DeliveryRecord' }

    WorkloadBoard:
      type: object
      description: >
        ★ v0.12.0 — El tablero de carga: qué falta despachar, por día y
        shipping code.
      properties:
        generated_at: { type: string, format: date-time }
        today:
          type: string
          description: >
            El día de la semana de HOY (LUNES..DOMINGO). El cálculo del "próximo
            día disponible" se hace desde aquí.
        totals:
          $ref: '#/components/schemas/WorkloadTotals'
        columns:
          type: array
          description: >
            Las columnas del tablero: LUNES a VIERNES, más SIN_DIA al final.
            Siempre vienen las 6, aunque estén vacías.
          items: { $ref: '#/components/schemas/WorkloadColumn'  }

    WorkloadColumn:
      type: object
      description: Una columna del tablero (un día, o SIN_DIA).
      properties:
        day:
          type: string
          enum: [LUNES, MARTES, MIERCOLES, JUEVES, VIERNES, SIN_DIA]
          description: >
            SIN_DIA agrupa lo que no cae en ningún día: pedidos sin shipping
            code, shipping codes sin días configurados, o configurados solo
            para sábado/domingo (que se ignoran).
        totals:
          $ref: '#/components/schemas/WorkloadTotals'
        groups:
          type: array
          description: Los shipping codes que caen en este día.
          items: { $ref: '#/components/schemas/WorkloadGroup' }

    WorkloadGroup:
      type: object
      description: Un shipping code dentro de una columna, con sus sumatorias.
      properties:
        shipping_code:
          type: integer
          nullable: true
          description: >
            El U_RSAP_SHIPPING_CODE (es INTEGER en SAP, no string).
            NULL para los pedidos sin shipping code (solo en SIN_DIA).
        shipping_code_name:
          type: string
          nullable: true
          description: El nombre de la zona (de la UDT RSAP_SHIPPING_CODE).
        totals:
          $ref: '#/components/schemas/WorkloadTotals'
        orders:
          type: array
          description: Los pedidos de este grupo.
          items: { $ref: '#/components/schemas/WorkloadOrder' }

    WorkloadOrder:
      type: object
      properties:
        order_uuid: { type: string, format: uuid }
        order_number: { type: string }
        client_code: { type: string }
        client_name: { type: string }
        total_units:
          type: number
          format: double
          description: Suma de unidades del pedido.
        total_amount: { type: number, format: double }
        in_truck:
          type: boolean
          description: >
            ★ Si el pedido YA está montado en un camión. FALSE = todavía hay que
            armarlo — es lo accionable del tablero.
        truck_id:
          type: string
          format: uuid
          nullable: true
          description: >
            ★ v0.12.0 — El id del camión donde va, si in_truck es true. NULL si
            no está en ninguno. Necesario para navegar al camión desde el
            tablero (el nombre NO es único — no sirve para identificarlo).
        truck_name:
          type: string
          nullable: true
          description: El camión donde va, si in_truck es true.
        is_overdue:
          type: boolean
          description: >
            ★ ATRASADO: el pedido ya existía cuando pasó su día de entrega y no
            se despachó. Aparece en el próximo día disponible con esta marca.

    WorkloadTotals:
      type: object
      description: Las sumatorias de un grupo, columna, o del tablero completo.
      properties:
        order_count: { type: integer }
        total_units: { type: number, format: double }
        total_amount: { type: number, format: double }
        in_truck_count:
          type: integer
          description: Cuántos de esos pedidos YA van en un camión.
        not_in_truck_count:
          type: integer
          description: ★ Cuántos NO están en ningún camión — lo que falta armar.
        overdue_count:
          type: integer
          description: Cuántos vienen atrasados.

    PickingBoard:
      type: object
      description: >
        ★ v0.13.0 — El piso de la bodega: los camiones activos con el avance de
        cada carril.
      properties:
        generated_at: { type: string, format: date-time }
        active_count:
          type: integer
          description: Camiones en curso (ASIGNADO/EN_PICKING/EN_REPARTICION).
        completed_today_count:
          type: integer
          description: Camiones que llegaron a ALISTADO hoy.
        trucks:
          type: array
          items: { $ref: '#/components/schemas/PickingBoardTruck' }

    PickingBoardTruck:
      type: object
      properties:
        truck_id: { type: string, format: uuid }
        truck_name: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TruckStatus' }
        order_count: { type: integer }
        stop_count: { type: integer }
        has_frozen:
          type: boolean
          description: Si el camión tiene carril FROZEN (ítems congelados).
        alistado_at:
          type: string
          format: date-time
          nullable: true
          description: Cuándo quedó ALISTADO. NULL si sigue en curso.
        lanes:
          type: array
          description: >
            El avance de cada carril. Van a su propio ritmo — uno puede estar
            repartiendo mientras el otro recolecta.
          items: { $ref: '#/components/schemas/PickingBoardLane' }

    PickingBoardLane:
      type: object
      description: El avance de UN carril, como lo ve el admin.
      properties:
        lane: { $ref: '#/components/schemas/PickingLane' }
        status: { $ref: '#/components/schemas/LaneStatus' }
        assigned_to: { type: string, nullable: true }
        assigned_to_name:
          type: string
          nullable: true
          description: El bodeguero que lo tiene. NULL si SIN_ASIGNAR.
        collection_progress:
          type: number
          format: double
          description: Fracción recogida de este carril (0..1).
        distribution_progress:
          type: number
          format: double
          description: >
            Fracción repartida de este carril (0..1). 0 mientras no haya
            empezado la repartición.
        item_count:
          type: integer
          description: Cuántos ítems distintos tiene este carril.
        shortages:
          type: array
          description: >
            ★ Los faltantes registrados en este carril, CON DETALLE. Es lo único
            sobre lo que el admin puede actuar mientras el bodeguero trabaja.
          items: { $ref: '#/components/schemas/PickingBoardShortage' }

    PickingBoardShortage:
      type: object
      properties:
        item_code: { type: string }
        item_name: { type: string }
        required_quantity:
          type: number
          format: double
          description: Cuánto se necesitaba.
        collected_quantity:
          type: number
          format: double
          description: Cuánto se logró recoger.
        missing_quantity:
          type: number
          format: double
          description: Cuánto faltó.
        note:
          type: string
          nullable: true
          description: La nota que dejó el bodeguero, si dejó alguna.

    DriverRoute:
      type: object
      description: >
        ★ v0.14.0 — TODO lo que el driver necesita para trabajar la ruta SIN
        CONEXIÓN. Esta es la descarga que hace antes de salir.
      properties:
        truck_id: { type: string, format: uuid }
        truck_name: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TruckStatus' }
        downloaded_at:
          type: string
          format: date-time
          description: Cuándo se generó esta descarga.
        started_at:
          type: string
          format: date-time
          nullable: true
          description: Cuándo el driver inició la ruta. NULL si no ha salido.
        total_stops: { type: integer }
        total_orders: { type: integer }
        pending_orders:
          type: integer
          description: Cuántos pedidos siguen sin registrar.
        stops:
          type: array
          description: >
            Las paradas en orden de entrega DIRECTO (el que definió el admin).
            ★ El driver puede reordenarlas EN SU VISTA, pero eso NO cambia este
            orden — es una preferencia local del dispositivo.
          items: { $ref: '#/components/schemas/DriverStop' }
        item_catalog:
          type: array
          description: >
            ★ v0.15.0 — El catálogo de ítems vendibles (~540), para que el driver
            pueda buscar por código o nombre al registrar un RETORNO DE PRODUCTO
            sin conexión. Un retorno es de facturas anteriores, así que el ítem
            puede NO estar en el camión de hoy.
          items:
            type: object
            properties:
              item_code: { type: string }
              item_name: { type: string }

    DriverStop:
      type: object
      properties:
        stop_number: { type: integer }
        client_code: { type: string }
        client_name: { type: string }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        zip_code: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        orders:
          type: array
          items: { $ref: '#/components/schemas/DriverOrder' }

    DriverOrder:
      type: object
      description: Un pedido a entregar, con sus líneas (para marcar ítem por ítem).
      properties:
        order_uuid: { type: string, format: uuid }
        order_number: { type: string }
        total_amount: { type: number, format: double }
        total_units: { type: number, format: double }
        pallet_labels:
          type: array
          items: { type: string }
          description: En qué pallets viene (para que el driver lo ubique en el camión).
        is_incomplete_delivery:
          type: boolean
          description: >
            Si al pedido le faltó producto en el picking. El driver debe saberlo
            ANTES de entregar — así no le sorprende un reclamo del cliente.
        delivery_status:
          allOf:
            - $ref: '#/components/schemas/DeliveryStatus'
          nullable: true
          description: Su estado de entrega, si ya se registró.
        lines:
          type: array
          description: Las líneas del pedido, para confirmar ítem por ítem.
          items:
            type: object
            properties:
              item_code: { type: string }
              item_name: { type: string }
              quantity:
                type: number
                format: double
                description: Cuánto lleva el camión de este ítem para este pedido.

    RouteSummary:
      type: object
      description: >
        ★ v0.14.0 — El resumen al cerrar la ruta, incluida la lista de
        RETORNADOS (lo que el driver trae de vuelta).
      properties:
        truck_id: { type: string, format: uuid }
        truck_name: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time }
        total_orders: { type: integer }
        delivered_count: { type: integer }
        partial_count: { type: integer }
        not_delivered_count: { type: integer }
        pending_count:
          type: integer
          description: >
            Pedidos que quedaron sin registrar. NO se les fuerza un estado; el
            admin los cierra desde el Dashboard si hace falta.
        returned_items:
          type: array
          description: >
            ★ RETORNADOS: todo lo que el cliente no recibió y vuelve en el
            camión. Consolidado de todas las paradas.
          items: { $ref: '#/components/schemas/ReturnedItem' }

    ReturnedItem:
      type: object
      properties:
        item_code: { type: string }
        item_name: { type: string }
        quantity:
          type: number
          format: double
          description: Total de unidades que vuelven.
        reason: { $ref: '#/components/schemas/ItemRejectionReason' }
        order_number: { type: string }
        client_name: { type: string }

    ProductReturnReason:
      type: string
      enum: [DANADO, EXPIRADO, NO_LO_QUIERE]
      description: >
        ★ v0.15.0 — Por qué el cliente devuelve el producto.
        Distinto de ItemRejectionReason (que es para lo que se rechaza al
        RECIBIR la entrega de hoy): esto es mercancía de facturas anteriores.

    ProductReturn:
      type: object
      description: >
        ★ v0.15.0 — Un retorno de producto registrado por un driver en ruta.
      properties:
        return_id:
          type: string
          format: uuid
          description: >
            El `return_uuid` que generó la app. Es la identidad del retorno.
        truck_id: { type: string, format: uuid }
        truck_name: { type: string, nullable: true }
        driver_username: { type: string }
        driver_name: { type: string, nullable: true }
        client_code: { type: string }
        client_name: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/ProductReturnItem' }
        total_units:
          type: number
          format: double
          description: Suma de las cantidades de todos los ítems.
        has_photo:
          type: boolean
          description: >
            Siempre true (la foto es obligatoria), pero se expone para que el
            Dashboard sepa si puede pedirla.
        photo_url:
          type: string
          nullable: true
          description: >
            La ruta para pedir la imagen — GET /admin/returns/{id}/photo.
            La foto NO viaja en este schema.
        note: { type: string, nullable: true }
        client_reference:
          type: string
          nullable: true
          description: Referencia que dio el cliente (factura, remisión). Texto libre.
        occurred_at:
          type: string
          format: date-time
          description: Cuándo ocurrió la visita (hora real, no la de sincronización).
        recorded_at:
          type: string
          format: date-time
          description: Cuándo llegó al servidor.

    ProductReturnItem:
      type: object
      properties:
        item_code: { type: string }
        item_name: { type: string }
        quantity: { type: number, format: double }
        reason: { $ref: '#/components/schemas/ProductReturnReason' }

    PaymentType:
      type: string
      enum: [CASH, CHEQUE]
      description: >
        ★ v0.16.0 — Cómo pagó el cliente.
        CHEQUE exige número de cheque y FOTO; CASH no lleva ninguno de los dos.

    Payment:
      type: object
      description: >
        ★ v0.16.0 — Un pago recibido en ruta. Registro INMUTABLE: no se edita ni
        se borra; si hubo error se ANULA dejando el rastro.
      properties:
        payment_uuid:
          type: string
          format: uuid
          description: El uuid que generó la app. Es la identidad del pago.
        truck_id: { type: string, format: uuid }
        truck_name: { type: string, nullable: true }
        driver_username: { type: string }
        driver_name: { type: string, nullable: true }
        client_code: { type: string }
        client_name: { type: string }
        amount: { type: number, format: double }
        payment_type: { $ref: '#/components/schemas/PaymentType' }
        check_number:
          type: string
          nullable: true
          description: Solo para CHEQUE.
        has_photo:
          type: boolean
          description: TRUE para CHEQUE (la foto es obligatoria), FALSE para CASH.
        photo_url:
          type: string
          nullable: true
          description: >
            Ruta para pedir la imagen — GET /admin/payments/{uuid}/photo.
            NULL para CASH. La foto NO viaja en este schema.
        note: { type: string, nullable: true }
        occurred_at:
          type: string
          format: date-time
          description: Cuándo se recibió el dinero (hora real de la visita).
        recorded_at:
          type: string
          format: date-time
          description: Cuándo llegó al servidor.
        is_voided:
          type: boolean
          description: >
            ★ Si el pago fue ANULADO. El registro sigue existiendo — el rastro
            importa. Los anulados NO suman a los totales.
        voided_at: { type: string, format: date-time, nullable: true }
        voided_by:
          type: string
          nullable: true
          description: Quién lo anuló.
        void_reason:
          type: string
          nullable: true
          description: >
            Por qué se anuló. Obligatorio al anular — un pago anulado sin
            explicación es una bandera roja que nadie puede resolver después.

    PaymentTotals:
      type: object
      description: Totales de un conjunto de pagos. Los ANULADOS no suman.
      properties:
        cash_total: { type: number, format: double }
        cheque_total: { type: number, format: double }
        grand_total: { type: number, format: double }
        payment_count:
          type: integer
          description: Pagos válidos (sin contar los anulados).
        voided_count: { type: integer }

    DriverPaymentSummary:
      type: object
      description: >
        ★ v0.16.0 — La caja del driver: lo que lleva recogido en su ruta.
      properties:
        truck_id: { type: string, format: uuid }
        truck_name: { type: string, nullable: true }
        totals: { $ref: '#/components/schemas/PaymentTotals' }
        payments:
          type: array
          description: Sus pagos, incluidos los anulados (marcados).
          items: { $ref: '#/components/schemas/Payment' }

    AdminPaymentList:
      type: object
      description: ★ v0.16.0 — Los pagos que ve el admin, con totales.
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        totals: { $ref: '#/components/schemas/PaymentTotals' }
        payments:
          type: array
          items: { $ref: '#/components/schemas/Payment' }

    TruckStatus:
      type: string
      enum: [BORRADOR, CONFIRMADO, ASIGNADO, EN_PICKING, EN_REPARTICION, ALISTADO, ASIGNADO_DRIVER, EN_RUTA, RUTA_CERRADA, CANCELADO]
      description: >
        Ciclo de vida del camión.
          BORRADOR    El admin lo está armando (agrega/quita órdenes libremente).
          CONFIRMADO  Listo para picar. Aún modificable. Requiere ruta para asignar.
          ASIGNADO    ★ v0.7.0 — Asignado a un bodeguero. Aún modificable/reasignable.
          EN_PICKING  Recolección en curso (fase 1). SE CONGELA.
          EN_REPARTICION  ★ v0.8.0 — Recolección completa; repartiendo en pallets.
          ALISTADO    Picking terminado (repartición cerrada). Listo para manifiesto.
          ASIGNADO_DRIVER ★ v0.14.0 — Asignado a un driver, aún no salió.
          EN_RUTA         ★ v0.14.0 — El driver inició la ruta; está despachando.
          RUTA_CERRADA    ★ v0.14.0 — El driver terminó la ruta.
          CANCELADO   Deshecho; sus órdenes vuelven a "sin asignar".

    TruckSummary:
      type: object
      properties:
        truck_id: { type: string, format: uuid }
        name:
          type: string
          nullable: true
          description: Etiqueta opcional (ej. "Camión 1 - Ruta 11").
        status: { $ref: '#/components/schemas/TruckStatus' }
        created_at: { type: string, format: date-time }
        order_count: { type: integer }
        total_amount:
          type: number
          format: double
          description: Suma de las órdenes del camión.
        shipping_codes:
          type: array
          items: { type: string }
          description: >
            Shipping codes (nombres: BNX3, QNS1...) presentes en el camión.
            Normalmente uno; puede haber varios. NO son rutas comerciales.
            Es el eje logístico.
        has_route:
          type: boolean
          description: >
            ★ v0.6.0 — Si el camión ya tiene su orden de paradas importado
            (de OptimoRoute). Requisito para picar en el Bloque 2.
        assigned_to:
          type: string
          nullable: true
          description: >
            ★ v0.7.0 — DEPRECADO en v0.10.0 (dos carriles). Se conserva por
            compatibilidad: refleja el bodeguero del carril REGULAR. Para el
            estado real usa `lanes`.
          deprecated: true
        assigned_to_name:
          type: string
          nullable: true
          description: DEPRECADO en v0.10.0. Ver `lanes`.
          deprecated: true
        has_frozen:
          type: boolean
          description: >
            ★ v0.10.0 — Si el camión tiene ítems congelados (ItemCode empieza
            con F). Lo CALCULA el sistema. Determina si se esperan 2 carriles
            (REGULAR + FROZEN) o solo 1 (REGULAR).
        lanes:
          type: array
          description: >
            ★ v0.10.0 — El avance de cada carril. Si has_frozen es false, solo
            trae el carril REGULAR.
          items: { $ref: '#/components/schemas/LaneProgress' }
        driver_username:
          type: string
          nullable: true
          description: >
            ★ v0.14.0 — El driver que tiene este camión. NULL si no se ha
            asignado.
        driver_name:
          type: string
          nullable: true
          description: ★ v0.14.0 — Nombre visible del driver.
        route_started_at:
          type: string
          format: date-time
          nullable: true
          description: ★ v0.14.0 — Cuándo el driver inició la ruta.
        route_finished_at:
          type: string
          format: date-time
          nullable: true
          description: ★ v0.14.0 — Cuándo la cerró.

    TruckDetail:
      allOf:
        - $ref: '#/components/schemas/TruckSummary'
        - type: object
          properties:
            note: { type: string, nullable: true }
            orders:
              type: array
              items: { $ref: '#/components/schemas/OrderSummary' }
              description: Las órdenes montadas en este camión.

    HoldReason:
      type: string
      enum: [CUPO_EXCEDIDO, MORA, CUPO_Y_MORA]
      description: >
        Por qué se retuvo la orden.
          CUPO_EXCEDIDO  balance + total de la orden > credit_limit
          MORA           tiene facturas vencidas más allá de los días de gracia
          CUPO_Y_MORA    ambas

    PriceListNumber:
      type: integer
      enum: [1, 2, 3]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      required: [token, role]
      properties:
        token: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        salesperson_code: { type: string, nullable: true }
        display_name: { type: string }

    CatalogItem:
      type: object
      required: [item_code, name, available, price_list_1, price_list_2, price_list_3]
      properties:
        item_code: { type: string }
        name: { type: string }
        category: { type: string }
        barcode: { type: string }
        price_list_1: { type: number, format: double }
        price_list_2: { type: number, format: double }
        price_list_3: { type: number, format: double }
        has_price_1: { type: boolean }
        has_price_2: { type: boolean }
        has_price_3: { type: boolean }
        stock: { type: number, format: double }
        available: { type: number, format: double }
        image_url: { type: string }
        active: { type: boolean }

    # ═══════════════ CLIENTE CON CARTERA (★ v0.4.0) ═══════════════
    Client:
      type: object
      required:
        [client_code, name, default_price_list, authorized_price_lists, credit]
      properties:
        client_code: { type: string }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        zipcode: { type: string }
        manager_name: { type: string }
        shipping_route:
          type: string
          description: Código de ruta/día de entrega (de OCRD.U_RSAP_ROUTE).
        default_price_list: { $ref: '#/components/schemas/PriceListNumber' }
        authorized_price_lists:
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: '#/components/schemas/PriceListNumber' }
        credit:
          $ref: '#/components/schemas/ClientCredit'
          # ★ v0.4.0 — la app lo usa para ADVERTIR offline.

    ClientCredit:
      type: object
      required: [balance, credit_limit, credit_available]
      description: >
        Situación de cartera del cliente. La app la usa para ADVERTIR al
        vendedor sin conexión.

        ⚠️ Estos datos son de la ÚLTIMA SINCRONIZACIÓN. Pueden estar
        desactualizados. El middleware re-evalúa con datos frescos al recibir
        la orden. **La app advierte; el middleware decide.**
      properties:
        balance:
          type: number
          format: double
          description: >
            Saldo actual del cliente (de SAP). ES LA CIFRA OFICIAL.
        credit_limit:
          type: number
          format: double
          description: Cupo de crédito.
        credit_available:
          type: number
          format: double
          description: credit_limit − balance. Puede ser NEGATIVO (ya lo excedió).
        overdue_count:
          type: integer
          description: Cuántas facturas tiene vencidas (más allá de la gracia).
        overdue_amount:
          type: number
          format: double
          description: Monto total vencido.
        max_days_overdue:
          type: integer
          description: >
            Días de atraso de la factura MÁS vencida.
            El middleware compara esto contra los días de gracia (5).
        has_overdue:
          type: boolean
          description: >
            Conveniencia: true si max_days_overdue supera los días de gracia.
            Calculado por el middleware (la app NO debe recalcular el umbral).
        grace_days:
          type: integer
          description: >
            Días de gracia vigentes (hoy 5). El middleware los envía para que la
            app pueda explicárselo al vendedor, no para que los recalcule.

    # ═══════════════ ESTADO DE CUENTA (★ v0.4.0) ═══════════════
    ClientStatement:
      type: object
      properties:
        client_code: { type: string }
        client_name: { type: string }
        credit:
          $ref: '#/components/schemas/ClientCredit'
        documents:
          type: array
          items: { $ref: '#/components/schemas/StatementDocument' }
        as_of:
          type: string
          format: date-time
          description: Cuándo se tomó esta foto de la cartera.

    StatementDocument:
      type: object
      properties:
        doc_type:
          type: string
          enum: [INVOICE, CREDIT_NOTE, PAYMENT_ON_ACCOUNT]
        doc_num: { type: string }
        doc_date: { type: string, format: date }
        due_date:
          type: string
          format: date
          nullable: true
          description: NULL para notas de crédito y pagos (no vencen).
        doc_total: { type: number, format: double }
        open_amount:
          type: number
          format: double
          description: >
            POSITIVO para facturas (el cliente debe).
            NEGATIVO para notas de crédito y pagos (restan deuda).
        days_overdue:
          type: integer
          nullable: true
          description: >
            Días de atraso. Negativo = aún no vence. NULL para NC y pagos.
        is_from_sage:
          type: boolean
          description: >
            true si viene de la migración de Sage (dato informativo).
            La deuda cuenta igual, venga de donde venga.
        sage_doc_number:
          type: string
          nullable: true
          description: Número original en Sage, si aplica.

    OrderCreate:
      type: object
      required: [client_uuid, client_code, lines]
      properties:
        client_uuid: { type: string, format: uuid }
        client_code: { type: string }
        taken_at: { type: string, format: date-time }
        notes: { type: string }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderLine' }

    OrderLine:
      type: object
      required: [item_code, quantity, unit_price, price_list]
      properties:
        item_code: { type: string }
        quantity: { type: number, format: double, minimum: 0 }
        unit_price:
          type: number
          format: double
          minimum: 0
          description: CERO ES VÁLIDO (muestra / promoción).
        price_list: { $ref: '#/components/schemas/PriceListNumber' }
        line_discount_pct:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: 100 ES VÁLIDO.

    OrderAccepted:
      type: object
      properties:
        client_uuid: { type: string, format: uuid }
        order_number: { type: string }
        status:
          $ref: '#/components/schemas/OrderStatus'
          # ★ v0.4.0 — APROBADA o RETENIDA_CARTERA
        hold_reason:
          allOf:
            - $ref: '#/components/schemas/HoldReason'
          nullable: true
          description: >
            ★ Presente solo si status = RETENIDA_CARTERA.
            Explica POR QUÉ, para mostrárselo al vendedor.
        received_at: { type: string, format: date-time }

    # ═══════════════ ESTADO DE LA ORDEN, SYNC-DOWN (★ v0.4.1) ═══════════════
    OrderStatusUpdate:
      type: object
      description: >
        GET /sync/orders. Deliberadamente liviano: solo lo que puede cambiar
        DESPUÉS de que la app ya recibió la orden vía POST /orders -- no repite
        client_name/lines/total_amount/notes (eso la app ya lo tiene).
      properties:
        client_uuid: { type: string, format: uuid }
        order_number: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        hold_reason:
          allOf:
            - $ref: '#/components/schemas/HoldReason'
          nullable: true
        decision_note:
          type: string
          nullable: true
          description: Nota del aprobador, o MOTIVO del rechazo.
        decided_at:
          type: string
          format: date-time
          nullable: true
        received_at: { type: string, format: date-time }
        delivery_status:
          allOf:
            - $ref: '#/components/schemas/DeliveryStatus'
          nullable: true
          description: >
            ★ v0.11.0 — El resultado de la entrega, para que el VENDEDOR sepa
            qué pasó con su pedido. NULL mientras no se haya registrado.
        delivery_reason:
          type: string
          nullable: true
          description: >
            ★ v0.11.0 — Por qué no se entregó (o se entregó parcial), legible
            para el vendedor. Con NO_ENTREGADO trae el motivo del pedido; con
            ENTREGADO_PARCIAL, un resumen de los ítems rechazados.
        delivered_at:
          type: string
          format: date-time
          nullable: true
          description: ★ v0.11.0 — Cuándo se registró la entrega.

    OrderSummary:
      type: object
      properties:
        client_uuid: { type: string, format: uuid }
        order_number: { type: string }
        salesperson_code: { type: string }
        client_code: { type: string }
        client_name: { type: string }
        taken_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        line_count: { type: integer }
        total_amount: { type: number, format: double }
        status: { $ref: '#/components/schemas/OrderStatus' }
        hold_reason:
          allOf:
            - $ref: '#/components/schemas/HoldReason'
          nullable: true
        notes: { type: string }

        # ── ★ v0.4.1: rastro de la decisión del admin ──
        # Están en OrderSummary (no solo en OrderDetail) para que la GRILLA
        # pueda mostrar el motivo del rechazo sin abrir el detalle.
        # Se heredan en OrderDetail y HeldOrder vía allOf.
        decided_by:
          type: string
          nullable: true
          description: Usuario admin que aprobó o rechazó. NULL si aún no hay decisión.
        decided_at:
          type: string
          format: date-time
          nullable: true
          description: Cuándo se tomó la decisión. NULL si aún no hay decisión.
        decision_note:
          type: string
          nullable: true
          description: >
            Nota del aprobador, o MOTIVO del rechazo (obligatorio al rechazar).
            ★ El VENDEDOR lo verá: es lo que le permite explicarle al cliente
            por qué su pedido no procedió.

        # ── ★ v0.5.0: shipping code (logística) y asignación a camión ──
        shipping_route:
          type: string
          nullable: true
          description: >
            Ruta COMERCIAL heredada del cliente (U_RSAP_ROUTE). Es para
            vendedores, NO para logística. No se usa para armar camiones.
        shipping_code:
          type: integer
          nullable: true
          description: >
            ★ Código LOGÍSTICO de la orden (U_RSAP_SHIPPING_CODE del cliente).
            ES el criterio para agrupar en camiones.
        shipping_code_name:
          type: string
          nullable: true
          description: Nombre legible del shipping code (BNX3, BRK1...).
        truck_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Camión al que está asignada la orden. NULL = sin camión
            ("sin asignar"). El admin la ve marcada para decidir.

    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          properties:
            lines:
              type: array
              items: { $ref: '#/components/schemas/OrderDetailLine' }
            # decided_by / decided_at / decision_note se heredan de OrderSummary.

    OrderDetailLine:
      type: object
      properties:
        item_code: { type: string }
        item_name: { type: string }
        quantity: { type: number, format: double }
        unit_price: { type: number, format: double }
        price_list: { $ref: '#/components/schemas/PriceListNumber' }
        line_discount_pct: { type: number, format: double }
        line_total:
          type: number
          format: double
          description: Puede ser 0 (promoción) — es VÁLIDO.

    # ═══════════════ ORDEN RETENIDA CON CONTEXTO (★ v0.4.0) ═══════════════
    HeldOrder:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          description: >
            Orden retenida, ENRIQUECIDA con el contexto de cartera del cliente,
            para que el admin pueda decidir sin salir de la bandeja.
          properties:
            client_credit:
              $ref: '#/components/schemas/ClientCredit'
            credit_after_order:
              type: number
              format: double
              description: >
                credit_available − total_amount.
                Cuánto cupo quedaría si se aprueba. Negativo = lo excede.
            overdue_amount_from_sage:
              type: number
              format: double
              description: >
                Cuánto de la mora viene de la migración de Sage.
                Contexto útil: una deuda de arrastre puede negociarse distinto
                que una mora reciente.

    AdminCatalogItem:
      type: object
      properties:
        item_code: { type: string }
        name: { type: string }
        category: { type: string }
        barcode: { type: string }
        price_list_1: { type: number, format: double }
        price_list_2: { type: number, format: double }
        price_list_3: { type: number, format: double }
        has_price_1: { type: boolean }
        has_price_2: { type: boolean }
        has_price_3: { type: boolean }
        no_price_any_list: { type: boolean }
        stock: { type: number, format: double }
        committed: { type: number, format: double }
        available: { type: number, format: double }
        active: { type: boolean }

    AdminClient:
      type: object
      properties:
        client_code: { type: string }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        zipcode: { type: string }
        manager_name: { type: string }
        shipping_route: { type: string }
        salesperson_code: { type: string }
        default_price_list: { $ref: '#/components/schemas/PriceListNumber' }
        additional_price_list:
          type: integer
          enum: [1, 2, 3]
          nullable: true
        authorized_price_lists:
          type: array

openapi: 3.0.3
info:
  title: Dinas WMS — API
  version: 0.29.0
  description: >
    Contrato de la API del middleware Dinas WMS.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.29.0 — ROL VENDEDOR_INSTITUCIONAL
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ AGREGA
      NUEVO ROL: VENDEDOR_INSTITUCIONAL — distinto de VENDEDOR y de
      ANALISTA_COMERCIAL. Opera desde el Dashboard (no la app iOS), tiene
      salesperson_code propio (mismo esquema que VENDEDOR), y puede tomar
      pedidos (POST /orders, mismo pipeline que la app de vendedores, sin
      campo de canal).

      PROVISIONING: POST /admin/salespersons/provision gana un campo
      OPCIONAL `role` (VENDEDOR | VENDEDOR_INSTITUCIONAL, default
      VENDEDOR). Omitirlo es compatibilidad total con los clientes
      existentes del endpoint. BODEGUERO/DRIVER siguen provisionándose
      por POST /admin/staff/provision (v0.24.0); ADMIN/APROBADOR_PAGOS/
      APROBADOR_CREDITOS/ANALISTA_COMERCIAL no se provisionan por
      ninguna de las dos vías.

      El 409 salesperson_already_provisioned aplica sin importar el rol
      solicitado: un salesperson_code admite UNA SOLA cuenta de login.
      GET /admin/sap-salespersons.has_login_account sigue siendo un
      booleano simple, no distingue por rol.

      DESCUENTO POR LÍNEA: sin cambio de tipo — nota de negocio nueva en
      OrderLine.line_discount_pct sobre el tope por rol.

    ★ QUÉ CORRIGE
      Role es el rol de LOGIN del WMS, no un atributo del vendedor en SAP
      (el espejo SapSalespersons solo trae salesperson_code, name,
      is_active — SAP no tiene ningún concepto de rol). Dos consultas lo
      trataban como si fuera un dato de SAP y respondían "¿es un vendedor
      real?" mirando Role == VENDEDOR:

      - GET /admin/salespersons — ahora lista toda cuenta CON
        salesperson_code, sin mirar rol.
      - La validación de client_code de POST /account-payments y
        POST /credit-requests — ahora exige que el salesperson_code del
        cliente mapee a una cuenta conocida, sin mirar su rol.

      Para VENDEDOR el resultado no cambia. La corrección es de criterio:
      ampliarlo a una lista de dos roles habría vuelto a romperse con el
      siguiente rol que lleve código.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.28.0 — MÓDULO DE PROMOCIONES
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ AGREGA
      Módulo completo de promociones — desde la gestión por el analista
      hasta el libro del vendedor y la integración al carrito de venta.

      NUEVO ROL: ANALISTA_COMERCIAL — puede crear/editar/activar/desactivar
      promociones. No tiene acceso a logística, aprobaciones, ni cartera.

      GESTIÓN (ANALISTA_COMERCIAL o ADMIN):
      - GET  /admin/promotions
      - POST /admin/promotions (empieza INACTIVE)
      - GET  /admin/promotions/{id}
      - PUT  /admin/promotions/{id} (solo si está INACTIVE)
      - POST /admin/promotions/{id}/activate
      - POST /admin/promotions/{id}/deactivate

      LIBRO DEL VENDEDOR (VENDEDOR o ANALISTA_COMERCIAL):
      - GET /promotions — solo las ACTIVE, vigentes (valid_from ≤ hoy ≤
        valid_to), y asignadas al vendedor autenticado.
        Búsqueda ?q= por título, código de ítem, o nombre de ítem.
      - GET /promotions/{id} — 403 si no está asignada al vendedor.

      CARRITO:
      - OrderLine gana promotion_group_id (nullable UUID) — todas las
        líneas del mismo bloque de promoción (condición + beneficio)
        comparten el mismo valor. Ese valor ES el promotion_id de la
        promoción, NO un UUID nuevo generado por el cliente (ver la
        descripción del campo en OrderLine — corregido en v0.29.0, el
        texto original de v0.28.0 era ambiguo). El servidor valida que
        el bloque sea completo y rechaza (400) pedidos donde se
        eliminen solo ALGUNAS líneas de un mismo grupo (el bloque es
        indivisible — se agrega y se elimina en conjunto).

      TIPOS DE PROMOCIÓN:
      - FREE_ITEMS: los ítems de beneficio tienen discount_pct=100.
      - DISCOUNTED_ITEMS: cada ítem de beneficio tiene su propio
        discount_pct definido por el analista.

      VIGENCIA: toda promoción tiene valid_from/valid_to (fechas de inicio
      y fin). Se activa/desactiva manualmente — un analista no puede
      activar una promoción con valid_to ya vencida.

      RESTRICCIÓN POR VENDEDOR: cada promoción lleva una lista de
      salesperson_codes autorizados — un vendedor solo ve las que le
      fueron asignadas explícitamente.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.27.0 — CONTROL MANUAL DE RECONCILIACIÓN ANTES DE FACTURAR
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ AGREGA
      Reemplaza el disparo automático de ORDER_INVOICE en ALISTADO
      (v0.22.0) por un flujo manual con chequeo de stock previo:

      - GET /admin/trucks/{truck_id}/invoice-readiness — compara demanda
        agregada del camión (todas las órdenes) contra stock real
        (vw_WMS_Stock, almacén 01). Persiste checked_at/is_clean en el
        camión — es la base de lo que exige el envío.
      - POST /admin/trucks/{truck_id}/orders/{order_uuid}/items/{item_code}/reduce-allocation
        — reducción DIRIGIDA (solo esa orden+ítem, nada más del camión),
        reason OBLIGATORIO para auditoría.
      - POST /admin/trucks/{truck_id}/send-to-invoicing — reemplaza el
        disparo automático. EXIGE invoice-readiness limpio y de los
        últimos 5 minutos (409 si no). Aquí, no en ALISTADO, se calcula
        y persiste bin_allocations.

      El disparo automático original (RefreshAggregateStatusAsync,
      commit c3921d7) debe ELIMINARSE — un camión en ALISTADO ya no
      encola nada por sí solo.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.26.0 — ASIGNACIÓN DE BIN POR LÍNEA (ORDER_INVOICE)
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ AGREGA
      La primera factura real fue rechazada por SAP (400, code -10:
      "Fully allocate item X to bin locations") — el almacén 01 exige
      DocumentLinesBinAllocations cuando un ítem tiene más de un bin
      (AutoAllocOnIssue=whsBinSingleChoiceOnly). Investigación confirmó que
      el Wave Picking recoge por CAMIÓN, no por orden — a nivel de línea
      individual no existe (ni puede existir) el dato de qué bin específico
      recibió cada cliente, solo a nivel de camión agregado.

      bin_allocations (por línea): cómo repartir la cantidad entre los bins
      reales. Un solo bin → hecho directo, approximate=false. Más de un
      bin → repartido determinísticamente (fill-first) entre las órdenes
      que comparten ese ítem+camión, approximate=true — exacto en el
      agregado del camión, aproximado por línea individual (no hay otra
      opción físicamente posible dado cómo funciona el Wave Picking).

      Calculado y PERSISTIDO una sola vez al encolar la tarea (misma
      transacción atómica que crea todas las tareas del camión — el
      conjunto de órdenes ya está congelado desde antes de ALISTADO, así
      que no hay órdenes tardías ni condición de carrera entre tareas).
      GET /pending nunca recalcula, solo lee lo guardado.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.25.0 — TOTALES ESPERADOS EN EL SNAPSHOT DE ORDER_INVOICE
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ AGREGA
      Vacío encontrado al leer la primera tarea real de ORDER_INVOICE en la
      cola: el snapshot no traía ningún total (ni por línea, ni por
      documento). Sin eso, el sincronizador no tiene contra qué comparar el
      DocTotal real que devuelva SAP tras crear la factura — la salvaguarda
      contra divergencias de redondeo (SAP calcula LineTotal con el precio
      con descuento SIN redondear antes de multiplicar, verificado con
      datos reales) se quedaba sin contraparte.

      - expected_line_total (por línea): quantity × unit_price ×
        (1 - discount_pct/100), calculado con la misma fórmula exacta que
        usa SAP — no redondear antes de multiplicar.
      - expected_doc_total (a nivel de order_invoice): suma de todos los
        expected_line_total.

      El sincronizador compara esto contra lo que SAP devuelva de verdad;
      si no coincide, lo reporta como advertencia, nunca lo fuerza a cuadrar
      ni lo trata como error bloqueante.

      Nota de corrección (no es cambio de contrato, es aclaración): el
      campo "invoice_uuid" mencionado en descripciones anteriores nunca
      existió — el snapshot solo tiene order_uuid (= document_uuid de la
      tarea). Usar order_uuid= como prefijo en Comments, no invoice_uuid=.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.24.0 — CREAR CUENTAS DE BODEGUERO/DRIVER DESDE CERO
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ AGREGA
      Vacío encontrado en medio de una prueba real (llevar un pedido por
      todo el ciclo de picking para Órdenes de Venta → Facturas): un
      ambiente recién migrado/limpio (droplet o cualquier middleware
      nuevo) solo tiene el admin del bootstrap — no hay bodegueros ni
      drivers para asignar/completar un picking.

      A diferencia de /admin/salespersons/provision (que ACTIVA una
      cuenta para alguien que ya existe como SlpCode real en SAP),
      BODEGUERO y DRIVER no son un concepto de SAP — son personal interno
      del WMS, sin ningún espejo contra el cual validar.

      - GET /admin/staff — lista el personal ya creado (Role IN
        (BODEGUERO, DRIVER)), directo de la tabla de login, sin espejo.
      - POST /admin/staff/provision — crea una cuenta desde cero
        (username, password, display_name, role ∈ {BODEGUERO, DRIVER}).
        Sin salesperson_code, sin vínculo a SAP (Code queda null).

      Vive en la MISMA pantalla "Gestionar Usuarios" del Dashboard, como
      sección aparte de la de vendedores — decisión explícita de Camilo
      de no crear una pantalla nueva para esto.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.23.0 — REFRESCO DEL ESPEJO A DEMANDA (alcance mínimo)
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ AGREGA
      Parte del diseño de "Órdenes de Venta → Facturas": antes de mandar a
      facturar, el jefe de bodega necesita un chequeo de stock real contra
      SAP (vw_WMS_Stock), y el espejo local hoy solo se refresca cada 15
      min (SapRefreshBackgroundService, dentro del propio middleware — NO
      es el sincronizador dinas-wms-sap-sync, son dos mecanismos
      completamente separados y en direcciones opuestas: este refresco
      lee de SAP hacia el WMS; el sincronizador escribe del WMS hacia SAP).

      POST /admin/sap-refresh/trigger — REQUIERE ADMIN. Llama directamente
      al mismo SapMirrorRefreshService que ya usa el timer, sin lógica
      nueva. Si ya hay un refresco en curso, espera ese y devuelve su
      resultado (nunca dos refrescos en paralelo). Síncrono.

      Alcance deliberadamente MÍNIMO — decidido así con Camilo para no
      estancar el bloque de facturación: NO incluye configuración de
      intervalo, NI un panel de control. Eso queda como su propio bloque
      futuro, cubriendo también el sincronizador de envíos (que hoy solo
      se puede forzar con un archivo centinela local en su propia máquina).

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.22.0 — ÓRDENES DE VENTA → FACTURAS (ORDER_INVOICE)
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ AGREGA
      Primer bloque nuevo de la cola genérica de integración SAP desde
      account-payments/credit-requests — document_type "ORDER_INVOICE"
      (string libre, sin migración, mismo principio de siempre).

      - GET /admin/sap-sync/order-invoices/pending
      - POST /admin/sap-sync/order-invoices/{task_id}/result

      Diseño confirmado tras investigación real del modelo de datos
      (contradice una suposición inicial — quedó documentado en
      sap-integration.md):
      - La orden del WMS NO tiene ninguna Orden de Venta (ORDR) previa en
        SAP. La Factura es standalone, el PRIMER documento que esta
        transacción toca en SAP.
      - Disparo: automático, cuando el camión de la orden llega a
        TruckStatuses.ALISTADO (Truck.AlistadoAtUtc) — no hay aprobación
        de negocio que lo encole, por eso este payload no tiene
        decided_by/decided_at.
      - Cantidad por línea: SUM(PalletAssignment.Quantity) por
        OrderUuid+ItemCode — NUNCA OrderLine.Quantity (la pedida original).
        Líneas sin nada repartido (faltante total) se excluyen del
        payload; si una orden entera no tiene ninguna línea repartida, no
        se encola ninguna tarea para ella.
      - Precio por línea: OrderLine.UnitPrice + LineDiscountPct,
        congelados al tomar el pedido — el WMS nunca los revalida, y SAP
        debe obedecerlos tal cual (nunca resolverlos por su cuenta).
        unit_price=0 y descuento=100% son válidos (promociones), no errores.

    ★ QUÉ NO INCLUYE TODAVÍA
      El payload real de Service Layer para crear la Factura (POST a
      Invoices) — eso requiere descubrimiento real vía $metadata, igual
      disciplina que con IncomingPayments. No asumido ni diseñado aquí.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.21.1 — APROVISIONAR VENDEDORES REALES (LOGIN)
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ AGREGA
      Vacío de contrato encontrado durante la validación de producción: la
      sincronización real de SAP llena SapSalespersons (espejo de solo
      lectura), pero eso NUNCA crea cuentas de login reales — el bootstrap
      solo crea UN admin. En producción, ningún vendedor podía entrar,
      aunque sus datos ya estuvieran sincronizados desde SAP.

      - GET /admin/sap-salespersons — REQUIERE ADMIN. Lee SapSalespersons
        (no la tabla de login), marca has_login_account por fila, para que
        la pantalla "Gestionar Usuarios" del Dashboard muestre quién falta
        por aprovisionar.
      - POST /admin/salespersons/provision — REQUIERE ADMIN. Crea la
        cuenta de login real (tabla Salespersons) para un salesperson_code
        que DEBE existir en SapSalespersons (400 si no). 409 si ese código
        ya tiene cuenta. El ADMIN define la contraseña inicial manualmente
        (mínimo 8 caracteres) — no autogenerada. display_name viene del
        espejo SAP, no se recibe en el body.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.21.0 — VENDEDOR CANCELA SU PROPIO REPORTE (CANCELADO)
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ AGREGA
      Vacío real encontrado en el flujo de Reportar Pago de la app de
      vendedores: si un vendedor reporta un pago o solicitud de crédito por
      error (factura/monto/cliente equivocado) y ya se sincronizó al
      servidor (PENDIENTE_APROBACION), no había forma de deshacerlo antes
      de que el aprobador lo revisara — la factura quedaba bloqueada
      permanentemente en la app (que bloquea nuevos reportes sobre una
      factura con un pago activo).

      - Nuevo estado CANCELADO en ApprovalStatus. Deliberadamente distinto
        de RECHAZADO: RECHAZADO = el aprobador revisó y decidió no aprobar;
        CANCELADO = el vendedor lo retiró antes de que nadie lo revisara.
      - POST /account-payments/{payment_uuid}/cancel — REQUIERE rol
        VENDEDOR (no el aprobador — ese sigue usando reject). Ownership
        validado contra el token. Motivo opcional. 409 si ya no está
        PENDIENTE_APROBACION.
      - POST /credit-requests/{request_uuid}/cancel — mismo patrón, mismo
        motivo (mismo problema puede darse en Solicitar Crédito).

    ★ QUÉ NO CUBRE (a propósito)
      Cancelar un pago/crédito YA APROBADO (posiblemente ya integrado a
      SAP) es un problema distinto — ahí sí hay una transacción real que
      revertir, con su propio rastro contable. Eso es responsabilidad del
      usuario del Dashboard, no del vendedor, y queda como una función
      aparte, futura, no diseñada en este cambio.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.20.0 — CORTE REAL: account-payments YA NO USA EL STUB
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ CAMBIA
      Primer corte real del proyecto de integración SAP — SOLO para
      account-payments. credit-requests sigue con el stub, sin cambios (esa
      integración nunca se construyó en el sincronizador).

      - POST /admin/account-payments/{id}/approve ya NO llama al stub de
        integración. En su lugar, encola (o reactiva, si el registro estaba
        en ERROR_INTEGRACION) una SapIntegrationTask real. El AccountPayment
        queda APROBADO de inmediato (decisión de negocio), con
        sap_incoming_payment_doc_num en NULL hasta que el sincronizador
        reporte el resultado real.
      - POST /admin/sap-sync/account-payments/{task_id}/result — CAMBIO DE
        COMPORTAMIENTO respecto a v0.18.0-v0.19.x: ya NO actualiza
        únicamente SapIntegrationTask. Ahora también actualiza el
        AccountPayment real (INTEGRADO → doc_num real; ERROR →
        ERROR_INTEGRACION). El endpoint equivalente de credit-requests NO
        cambió — sigue actualizando únicamente la tarea.
      - Reintento: un nuevo approve sobre un AccountPayment en
        ERROR_INTEGRACION reactiva la MISMA fila de SapIntegrationTask
        (vuelve a PENDIENTE, conserva attempts) — nunca crea una fila nueva,
        para no arriesgar una doble integración.

      Verificado end-to-end contra dev real: un pago quedó con
      sap_incoming_payment_doc_num = un doc_num real de SAP (no un
      placeholder "SIM-..."), y el ciclo ERROR→reintento→INTEGRADO fue
      confirmado sin duplicar filas.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.19.2 — GET /admin/salespersons
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ AGREGA
      Vacío real encontrado por el agente del Dashboard al construir
      "Reportar Pago": no existía forma de listar vendedores para el
      selector obligatorio de salesperson_code. Se agrega GET
      /admin/salespersons, mismo patrón que GET /admin/drivers (ya
      existente) — lista de usuarios con Role=VENDEDOR, código + nombre.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.19.1 — CORRECCIÓN: CANAL SOLO EFECTIVO/CHEQUE, TRANSFERENCIA
    APARTE, Y NUEVO ORIGEN "REPORTAR PAGO DESDE EL DASHBOARD"
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ CORRIGE de v0.19.0
      v0.19.0 decía que PaymentChannel (Oficina/Vendedor) era transversal a
      EFECTIVO/CHEQUE/TRANSFERENCIA. Era incorrecto — TRANSFERENCIA no usa
      ese concepto. En su lugar:

      - PaymentChannel (OFICINA|VENDEDOR): ahora SOLO para EFECTIVO/CHEQUE.
      - TransferBankAccount (CHASE_9280|CHASE_7815) — NUEVO. Exclusivo de
        TRANSFERENCIA, elegido directamente por quien reporta (no pasa por
        Oficina/Vendedor).

    ★ QUÉ AGREGA (nuevo alcance: pagos reportados desde el Dashboard)
      Hasta ahora, POST /account-payments solo lo llamaba la app de
      vendedores (caller VENDEDOR). Ahora también lo puede llamar el
      Dashboard (caller ADMIN), para una pantalla nueva de "Reportar Pago"
      ahí — mismo formulario que la app (facturas, monto, foto opcional).

      El comportamiento de payment_channel y salesperson_code (nuevo campo)
      depende de qué ROL hizo el POST:
      - VENDEDOR (app): payment_channel se fija a VENDEDOR automáticamente
        (la app no lo envía ni lo conoce); salesperson_code se toma del
        propio vendedor autenticado (cualquier valor enviado se ignora).
      - ADMIN (Dashboard): payment_channel es OBLIGATORIO para EFECTIVO/
        CHEQUE (el usuario de oficina elige, por defecto Oficina);
        salesperson_code es OBLIGATORIO (a qué vendedor se atribuye el pago).

      transfer_bank_account y check_number/bank_code se piden igual sin
      importar el rol del caller.

      Mapeo de cuentas confirmado (PaymentAccountMapping):
      EFECTIVO+OFICINA=110002, EFECTIVO+VENDEDOR=110004,
      CHEQUE+OFICINA=110099, CHEQUE+VENDEDOR=110003,
      TRANSFERENCIA+CHASE_9280=111001, TRANSFERENCIA+CHASE_7815=111002.

    ★ QUÉ NO CAMBIA
      OTRO sigue sin integrarse automáticamente a SAP — no requiere
      payment_channel, transfer_bank_account, ni cuenta resuelta.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.19.0 — CANAL DE PAGO Y DATOS DE CHEQUE (versión superada,
    ver corrección arriba)
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ AGREGA
      Descubierto durante las pruebas reales de IncomingPayments contra SAP:
      el AccountPaymentMethod (EFECTIVO/CHEQUE/TRANSFERENCIA/OTRO) por sí
      solo NO alcanza para saber qué cuenta contable usar en SAP — el
      vendedor/oficina elige, en el momento de la transacción, POR CUÁL DE
      DOS CANALES entró el dinero (Oficina vs Vendedor/Contratista), y eso
      determina la cuenta real.

      - payment_channel (enum OFICINA | VENDEDOR) — nuevo en
        AccountPaymentCreate y PendingAccountPayment. Obligatorio si method
        ∈ {EFECTIVO, CHEQUE, TRANSFERENCIA}; debe ser null si method=OTRO.
      - check_number, bank_code — nuevos en AccountPaymentCreate y
        PendingAccountPayment. Obligatorios solo si method=CHEQUE.
      - resolved_account_code — nuevo en el payload embebido de
        SapAccountPaymentSyncTask.account_payment. Lo resuelve el middleware
        server-side (tabla PaymentAccountMapping: method+payment_channel→
        cuenta), mismo principio que gl_account_code en créditos — el
        vendedor nunca elige el número de cuenta a mano.

      Mapeo confirmado (PaymentAccountMapping, a sembrar en el middleware):
      EFECTIVO+OFICINA=110002, EFECTIVO+VENDEDOR=110004,
      CHEQUE+OFICINA=110099, CHEQUE+VENDEDOR=110003,
      TRANSFERENCIA+OFICINA=111001, TRANSFERENCIA+VENDEDOR=111002.

    ★ QUÉ NO CAMBIA
      OTRO sigue sin integrarse automáticamente a SAP — queda fuera de
      alcance a propósito, se maneja manual. No requiere payment_channel ni
      cuenta resuelta.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.18.0 — COLA DE INTEGRACIÓN SAP (SapIntegrationTask)
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ AGREGA
      4 endpoints nuevos consumidos ÚNICAMENTE por el sincronizador local
      (Windows Service en el Windows Server, fuera de este repo): GET/POST
      de pendientes y resultado para account-payments y credit-requests
      (/admin/sap-sync/*). Auth: rol ADMIN (el sincronizador se loguea como
      cuenta de servicio, no hay rol nuevo).

      Esta es la primera pieza del proyecto de integración REAL a SAP
      Service Layer (reemplaza el stub de IncomingPayments/CreditNotes).
      La cola es genérica (SapIntegrationTask, document_type como string
      libre) para cubrir tipos de documento futuros (órdenes→facturas,
      retornos→voids, etc.) sin migración — pero los ENDPOINTS son
      específicos por tipo, no un endpoint genérico universal.

      IMPORTANTE: estos endpoints todavía NO tocan AccountPayment/
      CreditRequest. Los endpoints de aprobación existentes (v0.17.x)
      siguen usando el stub de integración tal cual — el corte hacia esta
      cola real es un paso posterior, deliberado, para cuando el
      sincronizador exista y esté probado.

